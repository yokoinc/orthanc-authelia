# Headers forwarded to Orthanc, and to Orthanc alone.
#
# The Authorization plugin looks for the session token in the headers listed
# by TokenHttpHeaders (orthanc.json). Contrary to what the order of that list
# suggests, it does not stop at the first one found: the LAST header present
# wins. Measured on orthancteam/orthanc:26.4.2 --
#
#   X-Auth-User: admin + Remote-User: test.orthanc -> External User,  2 rights
#   X-Auth-User: admin alone                       -> Administrator, 10 rights
#   Remote-User: test.orthanc alone                -> External User,  2 rights
#
# Sending Remote-User to Orthanc therefore amounts to replacing the group
# with the username. auth-service recognises no group, falls back to the
# default profile, and Orthanc Explorer 2 hides everything but the study
# list: no upload, no remote modalities, and none of the Shares and
# Administration entries anchored to them. No error is raised, neither by
# nginx, nor by Orthanc, nor in the interface.
#
# The nominative identity is not lost: it goes to auth-service through
# auth_headers.conf, where it feeds the audit log and the guard against
# self-deletion. Orthanc only needs the group.
#
# Remote-User is set to the empty string, which tells nginx not to forward
# the header at all. Removing it from the list would not be enough: nginx
# relays client headers by default, and anyone could then declare themselves
# an administrator by adding Remote-User to their request.
proxy_set_header api-key $auth_token;
proxy_set_header X-Auth-User $groups;
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups $groups;
