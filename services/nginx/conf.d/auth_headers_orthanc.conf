# En-tetes transmis a Orthanc (et a lui seul).
#
# Le plugin Authorization cherche le jeton de session dans les en-tetes listes
# par TokenHttpHeaders (orthanc.json). Contrairement a ce que l'ordre de cette
# liste laisse croire, il ne s'arrete pas au premier trouve : le DERNIER
# en-tete present l'emporte. Mesure sur orthancteam/orthanc:26.4.2 --
#
#   X-Auth-User: admin + Remote-User: test.orthanc -> External User,  2 droits
#   X-Auth-User: admin seul                        -> Administrator, 10 droits
#   Remote-User: test.orthanc seul                 -> External User,  2 droits
#
# Envoyer Remote-User a Orthanc revient donc a remplacer le groupe par
# l'identifiant. auth-service ne reconnait aucun groupe, retombe sur le profil
# par defaut, et Orthanc Explorer 2 masque tout sauf la liste des examens :
# ni televersement, ni modalites distantes, ni les entrees Partages et
# Administration qui s'y ancrent. Aucune erreur n'est levee, ni cote nginx,
# ni cote Orthanc, ni dans l'interface.
#
# L'identite nominative n'est pas perdue : elle part vers auth-service via
# auth_headers.conf, ou elle alimente le journal d'audit et le garde-fou
# anti-auto-suppression. Orthanc, lui, n'a besoin que du groupe.
#
# Remote-User est mis a la chaine vide, ce qui indique a nginx de ne pas
# transmettre l'en-tete du tout. Le supprimer de la liste ne suffirait pas :
# nginx relaie par defaut les en-tetes du client, et n'importe qui pourrait
# alors se declarer administrateur en ajoutant Remote-User a sa requete.
proxy_set_header api-key $auth_token;
proxy_set_header X-Auth-User $groups;
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups $groups;
