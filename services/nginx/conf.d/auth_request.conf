# Authelia authentication request configuration
#
# `auth_request /authelia/;` ne figure plus ici : ce fichier est aspire au
# niveau http par le glob conf.d/*.conf, et la directive s'y appliquait donc a
# toutes les routes sans que rien ne le dise. Elle est desormais DECLAREE dans
# nginx.ssl.conf, au niveau http, la ou on la lit. Meme comportement, meme
# cible ; les locations qui incluent ce fichier en heritent.
#
# Ce qui reste ici a un role different : recuperer l'identite renvoyee par
# Authelia, et faire qu'un navigateur arrive sur le formulaire de connexion
# plutot que sur une page d'erreur. C'est ce second point qui distingue une
# route de PAGE d'une route de DONNEES -- voir le bloc error_page du serveur.
auth_request_set $user $upstream_http_remote_user;
auth_request_set $groups $upstream_http_remote_groups;
auth_request_set $redirect $upstream_http_remote_name;

# Handle authentication errors - redirect to login page
error_page 401 = @authelia_redirect;
error_page 403 = @error403;