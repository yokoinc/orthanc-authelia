# Authelia authentication request configuration
#
# `auth_request /authelia/;` no longer appears here: this file is pulled in at
# http level by the conf.d/*.conf glob, so the directive applied to every route
# without anything saying so. It is now DECLARED in nginx.ssl.conf, at http
# level, where it can be read. Same behaviour, same target. The locations that
# include this file inherit it.
#
# What remains here has a different role: retrieving the identity returned by
# Authelia, and making a browser land on the login form rather than on an error
# page. That second point is what distinguishes a PAGE route from a DATA route
# -- see the server's error_page block.
auth_request_set $user $upstream_http_remote_user;
auth_request_set $groups $upstream_http_remote_groups;
auth_request_set $redirect $upstream_http_remote_name;

# Handle authentication errors - redirect to login page
error_page 401 = @authelia_redirect;
error_page 403 = @error403;