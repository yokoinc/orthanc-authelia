# En-tetes de l'amont (Authelia) masques pour eviter les doublons : nginx
# repose les siens juste apres, via security_headers_authelia.conf.
#
# La CSP, elle, N'EST PLUS masquee. Authelia en emet une stricte --
#   default-src 'self'; frame-src 'none'; object-src 'none';
#   style-src 'self' 'nonce-...'; frame-ancestors 'none'; base-uri 'self'
# -- qui etait remplacee par un simple "upgrade-insecure-requests", soit une
# perte de protection nette sur un portail d'authentification.
#
# Ce masquage avait une raison : nginx injectait un <style> INLINE dans la
# page de connexion (masquage du lien de reinitialisation), que
# style-src 'self' 'nonce-...' bloquait faute de nonce. L'injection se fait
# desormais par un <link> vers /auth/static/authelia-theme.css, servi par la
# meme origine, donc autorise par 'self'. L'obstacle a disparu.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
# Authelia envoie strict-origin-when-cross-origin ; nginx repose same-origin,
# qui est plus strict (aucun referent hors de l'origine). Sans ce masquage le
# navigateur recevait les deux.
proxy_hide_header Referrer-Policy;
