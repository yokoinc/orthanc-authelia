# Upstream (Authelia) headers hidden to avoid duplicates: nginx sets its own
# right after, through security_headers_authelia.conf.
#
# The CSP, however, is NO LONGER hidden. Authelia emits a strict one --
#   default-src 'self'; frame-src 'none'; object-src 'none';
#   style-src 'self' 'nonce-...'; frame-ancestors 'none'; base-uri 'self'
# -- which used to be replaced by a bare "upgrade-insecure-requests", a clear
# loss of protection on an authentication portal.
#
# That masking had a reason: nginx injected an INLINE <style> into the login
# page (hiding the reset link), which style-src 'self' 'nonce-...' blocked
# for lack of a nonce. The injection now goes through a <link> to
# /auth/static/authelia-theme.css, served by the same origin and therefore
# allowed by 'self'. The obstacle is gone.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
# Authelia sends strict-origin-when-cross-origin; nginx sets same-origin,
# which is stricter (no referrer outside the origin). Without this masking
# the browser received both.
proxy_hide_header Referrer-Policy;
