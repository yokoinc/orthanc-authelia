# Authentication headers for backend services
proxy_set_header api-key $auth_token;
# Remote-User doit porter l'identifiant, pas les groupes : il alimente le
# journal d'audit (qui a fait quoi) et le garde-fou qui empeche un admin de
# supprimer son propre compte. Les autorisations, elles, s'appuient sur
# Remote-Groups.
proxy_set_header Remote-User $user;
proxy_set_header Remote-Groups $groups;