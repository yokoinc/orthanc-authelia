# En-tetes d'authentification transmis aux services en amont.
#
# Trois consommateurs distincts, trois besoins differents :
#
#   X-Auth-User    lu par le plugin Authorization d'Orthanc, en tete de sa
#                  liste TokenHttpHeaders. Il le transmet a auth-service
#                  (/user/get-profile) qui en deduit les permissions, et
#                  attend donc le GROUPE, pas l'identifiant.
#
#   Remote-User    identifiant de la personne connectee. Alimente le journal
#                  d'audit du panel d'administration et le garde-fou qui
#                  empeche un administrateur de supprimer son propre compte.
#
#   Remote-Groups  groupes, utilises par les controles d'acces applicatifs
#                  (token manager, panel).
#
# Les melanger casse silencieusement : envoyer l'identifiant dans X-Auth-User
# fait retomber Orthanc sur un profil sans droits, sans message d'erreur.
proxy_set_header api-key $auth_token;
proxy_set_header X-Auth-User $groups;
proxy_set_header Remote-User $user;
proxy_set_header Remote-Groups $groups;
