# Authentication headers forwarded to auth-service (token manager, admin
# panel). For Orthanc, see auth_headers_orthanc.conf: the Authorization
# plugin imposes constraints there that are incompatible with this file.
#
#   Remote-User    username of the person logged in. Feeds the audit log and
#                  the guard that stops an administrator from deleting their
#                  own account. It is the stack's only source of nominative
#                  identity.
#
#   Remote-Groups  groups, for application-level access checks.
#
#   X-Auth-User    groups as well, for consistency with what the
#                  Authorization plugin expects on the Orthanc side.
#
# Do not add Remote-User to the Orthanc variant of this file: the plugin
# keeps the last recognised header, the username overwrites the group there,
# and the user loses their rights with no error raised.
proxy_set_header api-key $auth_token;
proxy_set_header X-Auth-User $groups;
proxy_set_header Remote-User $user;
proxy_set_header Remote-Groups $groups;
