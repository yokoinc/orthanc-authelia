# En-tetes d'authentification transmis a auth-service (token manager, panel
# d'administration). Pour Orthanc, voir auth_headers_orthanc.conf : le plugin
# Authorization y impose des contraintes incompatibles avec ce fichier.
#
#   Remote-User    identifiant de la personne connectee. Alimente le journal
#                  d'audit et le garde-fou qui empeche un administrateur de
#                  supprimer son propre compte. C'est la seule source
#                  d'identite nominative de la pile.
#
#   Remote-Groups  groupes, pour les controles d'acces applicatifs.
#
#   X-Auth-User    groupes egalement, par coherence avec ce qu'attend le
#                  plugin Authorization cote Orthanc.
#
# Ne pas ajouter Remote-User a la variante Orthanc de ce fichier : le plugin
# retient le dernier en-tete reconnu, l'identifiant y ecrase le groupe et
# l'utilisateur perd ses droits sans qu'aucune erreur ne soit levee.
proxy_set_header api-key $auth_token;
proxy_set_header X-Auth-User $groups;
proxy_set_header Remote-User $user;
proxy_set_header Remote-Groups $groups;
