# Security headers for Authelia with CSP upgrade
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
# Value computed by the entrypoint: max-age=0 with a self-signed
# certificate, failing which the browser blocks the site without offering an
# exception.
add_header Strict-Transport-Security "${HSTS}" always;
add_header Referrer-Policy "same-origin" always;
# No Permissions-Policy here: Authelia's covers sixteen directives (camera,
# microphone, geolocation, screen capture, payment...) where this one covered
# two. It is let through.
# No CSP added here either: Authelia's is left intact and is far stricter.
# Adding a second would harden nothing -- the browser applies the
# intersection of both -- but would muddy the diagnosis.