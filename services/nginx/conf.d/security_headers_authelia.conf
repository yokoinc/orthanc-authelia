# Security headers for Authelia with CSP upgrade
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Referrer-Policy "same-origin" always;
# Pas de Permissions-Policy ici : celle d'Authelia couvre seize directives
# (camera, micro, geolocalisation, capture d'ecran, paiement...) la ou
# celle-ci n'en couvrait que deux. Elle est laissee passer.
# Pas de CSP ajoutee ici : celle d'Authelia est laissee intacte et elle est
# bien plus stricte. En poser une seconde ne durcirait rien -- le navigateur
# applique alors l'intersection des deux -- mais brouillerait le diagnostic.