# =============================================================================
# NGINX SSL CONFIGURATION FOR ORTHANC-AUTHELIA
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 2g;

    # SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP stapling: DISABLED, and it is not an oversight.
    #
    # This server's certificate is self-signed (it is only used between the
    # Cloudflare tunnel and nginx). It therefore has no issuer to query, and
    # nginx said so on every start:
    #
    #   [warn] "ssl_stapling" ignored, issuer certificate not found
    #
    # Stapling was not happening; only the warning was real. Recurring noise in
    # the logs is what makes people miss a real message -- it is removed rather
    # than learning to stop reading it.
    #
    # If this server ever carries a certificate signed by an authority, restore
    # these two lines AND add ssl_trusted_certificate, otherwise the same
    # warning will come back.
    #
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # The hash table of the headers passed to upstreams.
    #
    # nginx complained on every start:
    #   [warn] could not build optimal proxy_headers_hash, you should increase
    #          either proxy_headers_hash_max_size: 512 ...
    #
    # This stack adds many headers (Authelia, Cloudflare, DICOMweb) and exceeds
    # the default table. nginx copes, but by degrading its lookups -- and says
    # so every time.
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript 
               application/xml+rss application/rss+xml 
               application/atom+xml image/svg+xml;

    # --- Real visitor address ---------------------------------------------
    #
    # All public traffic enters through the Cloudflare tunnel container, so
    # $remote_addr is ALWAYS its address on the Docker network. The zones below
    # therefore counted on one and the same key for the whole installation: one
    # person's quota was everyone's quota.
    #
    # Found on 2026-08-28: a click on "Sign out" returned a 502 page. It was
    # not an outage -- limit_req answers 503, and the error_page further down
    # maps 503 to 502.html. The portal was simply exceeding its quota on its
    # own.
    #
    # set_real_ip_from is deliberately limited to the Docker subnet: only the
    # tunnel may set this header. A request arriving directly from the LAN has
    # no CF-Connecting-IP and keeps its source address.
    #
    # MUST match the `ipam.config.subnet` of the orthanc-network network in
    # docker-compose.yml. That subnet is PINNED there, so it does not drift by
    # itself -- but if you change it there, change it here: otherwise the
    # header stops being honoured, without the slightest message, and quotas
    # become shared across the whole installation again, as before.
    set_real_ip_from 192.168.80.0/20;
    real_ip_header CF-Connecting-IP;

    # Rate limiting
    #
    # 5r/m on /auth/ was untenable even for a single person: showing the
    # portal, signing in and then signing out exceeds the quota on its own.
    # This limiter is NOT the protection against dictionary attacks -- that is
    # the job of Authelia's `regulation` (3 attempts, 5 min, 15 min ban, and it
    # persists in the database). Here we only want a coarse safeguard against a
    # runaway client.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    # 429 "Too Many Requests" rather than the default 503, which got repainted
    # as "502 Service Unavailable" and sent people looking for a server outage
    # where there was only a quota.
    limit_req_status 429;

    # Include additional configurations
    #
    # WARNING: this glob ALSO pulls in conf.d/auth_request.conf, which contains
    # `auth_request`. That directive being valid in http context, it applied to
    # EVERY route without anything saying so -- and that is what locked the
    # sign-in page for three days: /auth/ inherited authentication, so you had
    # to be signed in to reach the sign-in form.
    #
    # The behaviour is kept: deny by default, a new route is protected unless
    # it opts out. That is the right default for a PACS. But it is now DECLARED
    # below, where it can be read.
    include /etc/nginx/conf.d/*.conf;

    # =========================================================================
    # DEFAULT AUTHENTICATION
    # =========================================================================
    # Every route is protected unless stated otherwise. A route that must be public
    # opts out explicitly with `satisfy any; allow all;` -- that is what /auth/,
    # /api/, /static/, /locales, /auth/static/ and the OHIF files do. A route that
    # needs ANOTHER validator redeclares `auth_request` at its own level:
    # /_verify-share for share links, /_verify-cf for programmatic upload.
    #
    # Forgetting to open a route makes it unreachable; forgetting to close a
    # route would expose patient data. The default therefore leans the right
    # way, and that is deliberate.
    auth_request /authelia/;
    
    # =============================================================================
    # UPSTREAM SERVERS
    # =============================================================================
    upstream orthanc {
        server orthanc:8042;
    }

    upstream authelia {
        server authelia:9091;
    }

    upstream auth_service {
        server auth-service:8000;
    }

    upstream ohif {
        server ohif:8080;
    }

    # =============================================================================
    # TOKEN MAPPING
    # =============================================================================
    map $groups $auth_token {
        ~admin    "admin-token";
        ~doctor   "doctor-token";
        ~external "external-token";
        default   "";
    }

    # Probe for the /api-upload/ path: records whether Cloudflare relays the
    # service-token headers to the origin, without ever logging their value.
    # The client id is not secret, but there is no reason to write it down, and
    # presence is the only thing being established here.
    map $http_cf_access_client_id $cf_id_present {
        ""        "no";
        default   "yes";
    }
    map $http_cf_access_client_secret $cf_secret_present {
        ""        "no";
        default   "yes";
    }
    # Cloudflare Access consumes the service-token headers and injects a signed
    # assertion instead; this records which of the two actually arrives.
    map $http_cf_access_jwt_assertion $cf_jwt_present {
        ""        "no";
        default   "yes";
    }
    log_format upload_probe '$remote_addr [$time_local] "$request" $status '
                            'cf_id=$cf_id_present cf_secret=$cf_secret_present '
                            'cf_jwt=$cf_jwt_present cf_ray=$http_cf_ray';

    # Drives the "Administration" entry injected into the OE2 sidebar. The panel
    # itself re-checks the group, but a button leading to a 403 is worse than no
    # button, so non-admins never get it rendered.
    map $groups $show_admin_menu {
        ~admin    "true";
        default   "false";
    }

    # =========================================================================
    # EFFECTIVE DOMAIN
    # =========================================================================
    # nginx adapts to the domain the client requested, instead of freezing it.
    #
    # ${DOMAIN} used to be substituted by envsubst WHEN THE CONTAINER STARTED.
    # Changing domain therefore meant RECREATING nginx -- a mere restart keeps
    # the old value, the environment variable being frozen at creation. $host
    # is evaluated on every request: the domain now follows by itself.
    #
    # $host, not $http_host: nginx strips the port from it, and a cookie never
    # carries one (RFC 6265). Authelia rejects a domain that does not match its
    # cookie configuration -- exactly the error that made this installation
    # unusable for three days.
    #
    # The fallback exists for access by IP ADDRESS. Monitoring probes query
    # https://192.168.1.100:30443: without the fallback, Authelia would receive
    # a numeric Host, refuse it, and the probe would turn red without any
    # service being down. This fallback stays frozen at startup, but it only
    # concerns that path.
    map $host $domaine_effectif {
        default                    $host;
        "~^\d{1,3}(\.\d{1,3}){3}$" ${DOMAIN};
        localhost                  ${DOMAIN};
    }

    # =========================================================================
    # SIGN-IN PAGE ADDRESS -- port included
    # =========================================================================
    # $domaine_effectif strips the port, which is right for a cookie or a Host
    # header. But @authelia_redirect used it to build a URL:
    # "https://$domaine_effectif/auth/". Invisible here, where Cloudflare serves
    # 443; on a local installation listening on 30443, the signed-out visitor was
    # sent to https://pacs.localhost/auth/ -- port 443, where nothing listens.
    # Measured on 2026-09-13: rd= did keep :30443, the sign-in page did not.
    #
    # The key combines the configured domain and the requested host, to tell apart:
    #   - a local installation (DOMAIN under .localhost) opened through
    #     https://localhost:PORT: same machine, same nginx, so the typed port
    #     also applies to the domain;
    #   - access by IP or by localhost on a public installation: the typed
    #     port (30443) does NOT apply to the domain, which Cloudflare serves on
    #     443. Behaviour unchanged;
    #   - the general case: the visitor's exact origin, port included if one was
    #     typed. Behind Cloudflare, the Host header carries none: unchanged.
    map $http_host $port_client {
        "~:(?<port_tape>\d+)$" ":$port_tape";
        default                "";
    }
    #  Host name WITH the port, and not only for the redirect: it is also what
    # Authelia must receive as X-Forwarded-Host. It derives the address of its
    # own files from it. Without the port, its sign-in page loaded
    # https://pacs.localhost/static/... -- blocked by the browser (different
    # origin), an entirely BLANK page on a local installation. Invisible on the
    # command line (curl does not load a page's files); found in a browser on
    # 2026-09-13.
    map "${DOMAIN}|$host" $hote_connexion {
        "~^[^|]+\.localhost\|localhost$" "${DOMAIN}$port_client";
        "~\|\d{1,3}(\.\d{1,3}){3}$"      "${DOMAIN}";
        "~\|localhost$"                  "${DOMAIN}";
        default                          "$http_host";
    }

    # =============================================================================
    # HTTP TO HTTPS REDIRECT SERVER
    # =============================================================================
    server {
        listen 80;
        server_name _;
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =============================================================================
    # MAIN HTTPS SERVER
    # =============================================================================
    server {
        listen 443 ssl;
        server_name _;

        # SSL
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Buffer configuration
        large_client_header_buffers 8 16k;
        client_body_buffer_size 128k;
        client_header_buffer_size 4k;
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
        
        # Security headers (centralized configuration)
        include /etc/nginx/conf.d/security_headers.conf;
        etag off;

        # Relative redirects (Location: /ui/app/ instead of
        # https://host:443/ui/app/). nginx listens on 443 inside the
        # container while Docker publishes on 30443, so an absolute redirect
        # sends the browser to a closed port -- reaching the stack by IP,
        # https://host:30443/ answered 302 towards https://host/ui/app/ and
        # died there. Relative keeps whatever origin the browser already uses,
        # which is also what makes the domain and the IP behave the same.
        absolute_redirect off;

        # Root redirection - always redirect to UI, let UI handle authentication
        location = / {
            return 302 /ui/app/;
        }

        # Static assets (no authentication required)
        
        # Authelia static assets
        location ~ ^/static/?(.*)$ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://authelia/static/$1;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/remove_csp.conf;
            
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        
        # Orthanc Explorer 2 favicon for app path requests
        location ~ ^/app/.*favicon\.ico$ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            rewrite ^/app/.*favicon\.ico$ /ui/app/favicon.ico break;
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Historical alias to the viewer. /app/X lands on / of the OHIF
        # container, which serves under /ohif/: the SPA fallback therefore
        # returns index.html.
        #
        # This route had NO authentication. It answered 401, but by accident:
        # the OHIF container refuses directory listing, proxy_intercept_errors
        # intercepts, and the error page goes through Authelia. No rule decided
        # to protect it -- a path serving a file instead of a directory would
        # have come out in clear. Over 48 h of logs: a single request, from an
        # external scanner. It is aligned on /ohif/ rather than deleted, since
        # the favicon rule just above relies on that prefix.
        location /app/ {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://ohif/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;
        }
        
        # Authelia locales
        location = /locales {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://authelia/locales;
            include /etc/nginx/conf.d/proxy_headers.conf;
            expires 1h;
            add_header Cache-Control "public";
        }
        
        # Authelia locale files
        location ~ ^/locales/[^/]+/[^/]+\.json$ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://authelia$request_uri;
            include /etc/nginx/conf.d/proxy_headers.conf;
            expires 1h;
            add_header Cache-Control "public";
        }

        # ---------------------------------------------------------------------
        # REMOVED on 2026-08-23: this rule bypassed Authelia.
        #
        # Being a regular expression declared early in the file, it caught EVERY URL
        # ending in .js/.css/.png/.json/... before the authenticated routes were
        # examined, and sent it to Orthanc without authentication. Measured before
        # removal:
        #     /ui/          -> 302 Authelia   |  /ui/app/zzz.js  -> 200 Orthanc
        #     /dicom-web/   -> 302 Authelia   |  /dicom-web/zzz.js -> 403 Orthanc
        #     /studies/     -> 302 Authelia   |  /studies/zzz.js -> 403 Orthanc
        # Only Orthanc's authorization plugin refused those requests: the protection
        # was in the PACS, not in the reverse proxy.
        #
        # It served the Orthanc Explorer 2 static files. Pointless: /ui/ is already an
        # authenticated route that serves its own files.
        # ---------------------------------------------------------------------
        #         # General static assets
        #         location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|json|gz|wasm|woff|woff2|ttf|eot|map)$ {
        #             satisfy any;                    # Allow access without authentication
        #             allow all;                      # Allow all IPs
        #             
        #             proxy_pass http://orthanc;
        #             include /etc/nginx/conf.d/proxy_headers.conf;
        #             
        #             expires 1y;
        #             add_header Cache-Control "public, immutable";
        #         }

        # Authenticated application routes
        
        # Shared studies access (exact match for highest priority)  
        location = /share/ {
            auth_request off;               # Explicitly disable authentication
            proxy_pass http://auth_service/share/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/security_headers.conf;
        }
        
        # Two routes lived here, /share/api/ and
        # ^/share/(studies|series|instances|...)$, inherited from a share page
        # that fetched the data itself. Removed: nothing calls them any more.
        #
        # The current flow does not go through them. /share/?token=X validates
        # the token (auth_service.py, share_redirect) then REDIRECTS to the
        # viewer -- /ohif/, /stone-webviewer/index.html or /volview/index.html
        # -- with the token as a parameter. It is then the viewer's /dicom-web
        # and /wado calls that carry the access, validated by /_verify-share.
        #
        # Checked before removal: zero references in the whole repository (py,
        # js, html, json) and no traffic in the logs apart from my own probes.
        
        # Orthanc web interface
        location /ui/ {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;

            # Extra sidebar entries (Partages, Administration, Deconnexion).
            # The code lives in oe2-menu.js, served unauthenticated from
            # /auth/static/: a config parameter cannot exceed 4096 bytes and the
            # inline version outgrew it. Only the admin flag stays here, since it
            # comes from the $groups map. Bump ?v= when oe2-menu.js changes.
            sub_filter '</head>' '<script>window.__OE2_IS_ADMIN__=$show_admin_menu;</script><script src="/auth/static/oe2-menu.js?v=21"></script></head>';
            sub_filter_once on;
        }
        
        # Stone WebViewer
        location /stone-webviewer/ {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }
        
        # VolView WebViewer
        location /volview/ {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }
        
        # OHIF static assets (all files except viewer pages)
        #
        # oe2-menu.js: NEVER cached either.
        #
        # This script carries the menu logic injected into Explorer 2. It was
        # served with max-age=14400 and Cloudflare kept it for four hours
        # (cf-cache-status: HIT, age 1 h 43 when noticed). Result on
        # 2026-08-29: several successive menu fixes were deployed, checked
        # inside the container -- and never received by the browser, which
        # replayed the old version. The ?v= parameter is meant to get around
        # that, but it only takes it no longer being incremented for the trap
        # to close again.
        #
        # Same reasoning as for app-config.js: this is not a frozen resource,
        # it is code that gets changed. OHIF's bundles, on the other hand,
        # rightly keep their one-year cache -- their name carries a
        # fingerprint.
        location = /auth/static/oe2-menu.js {
            satisfy any;
            allow all;

            proxy_pass http://auth_service/static/oe2-menu.js;
            include /etc/nginx/conf.d/proxy_headers.conf;

            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # app-config.js: NEVER cached.
        #
        # Declared with `=` so as to come BEFORE the static assets rule below,
        # which set `expires 1y; Cache-Control: public, immutable`. Yet this
        # file is not a frozen resource: it is OHIF's configuration, mounted
        # from the host and edited by hand. With a year of immutability, every
        # change became invisible -- the browser served its copy, and
        # Cloudflare its own.
        #
        # Found on 2026-08-29: two settings changed and deployed, checked
        # inside the container, remained without the slightest effect. The
        # loaded application was still reading the old file (cf-cache-status:
        # HIT, age 4 days, max-age 31536000). An hour of diagnosis on fixes
        # that had never reached the browser.
        #
        # The bundles rightly keep their one-year cache: their name carries a
        # fingerprint, different content lives at a different address.
        location = /ohif/app-config.js {
            satisfy any;
            allow all;

            proxy_pass http://ohif;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;

            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location ~ ^/ohif/(.+\.(js|css|png|jpe?g|gif|svg|ico|webp|json|gz|wasm|woff|woff2|ttf|eot|map|txt))$ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://ohif;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # OHIF viewer assets directory
        location ^~ /ohif/assets/ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://ohif;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # OHIF Viewer
        location /ohif/ {
            # An identical regex existed here, nested. It was UNREACHABLE:
            # nginx evaluates the regular-expression `location`s of the
            # `server` block BEFORE settling on a prefix, and the server-level
            # one covers exactly the same extensions. A nested location is only
            # examined once its parent has been chosen -- which never happens
            # for these files.
            #
            # Removed, keeping the one that is actually used.

            # Require authentication for viewer pages
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://ohif;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;

            # Bypass of the Cloudflare cache already built up.
            #
            # app-config.js was served for months with max-age=31536000,
            # immutable. It is fixed at the origin (see the = location above),
            # but the copy ALREADY cached at the edge still carries that header
            # and will not be revalidated: without a manual purge, it would
            # live for a year. Cloudflare keying by URL, adding a parameter is
            # enough to bypass it for good -- the new address has never been
            # seen, and what it returns now carries no-store, so nothing will
            # be cached again.
            #
            # The parameter does not need to change afterwards: no-store does
            # the work. It only serves to escape the old entry.
            #
            # Empty Accept-Encoding: sub_filter cannot rewrite a compressed
            # response, it would pass through unchanged without a word.
            proxy_set_header Accept-Encoding "";
            sub_filter 'app-config.js' 'app-config.js?v=2';
            sub_filter_once on;
        }

        # DICOM API endpoints (authenticated)
        
        # WADO (Web Access to DICOM Objects)
        #
        # Session OR share token: $point_auth picks the validator depending on
        # whether ?token= is present. The directives are set here rather than
        # through `include auth_request.conf`, whose target is fixed on
        # Authelia -- and which cannot be duplicated as a variant, since a file
        # dropped into conf.d/ is also pulled in at http level by the http-level
        # include conf.d/*.conf, which would apply it to EVERY route. A request arrives
        # here in two legitimate ways: from a signed-in user (session cookie),
        # or from a share link (?token=...). Two different validators are
        # therefore needed.
        #
        # `auth_request $variable` DOES NOT WORK: the directive does not
        # interpolate variables, nginx looks for a file literally named
        # "$point_auth" and answers 403. Found on the test bench.
        #
        # We therefore switch to a NAMED LOCATION, which preserves $uri and the
        # arguments -- a `rewrite` would lose them. The 418 never goes out on
        # the network: it is only an internal signal towards @partage.
        location /wado {
            error_page 418 = @wado_partage;
            if ($arg_token) { return 418; }

            include /etc/nginx/conf.d/auth_request.conf;
            include /etc/nginx/conf.d/extract_token.conf;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        location @wado_partage {
            auth_request /_verify-share;
            error_page 401 403 @error403;   # no =: keeps the status, see further down

            # Orthanc reads the token from this header (TokenHttpHeaders in
            # orthanc.json). That is what lets it enforce the share's SCOPE:
            # its plugin calls /tokens/validate, and check_resource_access
            # limits access to the resources the token really covers. Division
            # of roles: nginx checks that the token exists and has not expired,
            # Orthanc decides what it opens.
            #
            # So extract_token.conf is certainly not included here: it empties
            # this header, which made the request anonymous -- nginx let it
            # through, and Orthanc refused it behind with an inexplicable 403.
            proxy_set_header auth-token $arg_token;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # DICOM-Web API
        location /dicom-web {
            error_page 418 = @dicomweb_partage;
            if ($arg_token) { return 418; }

            include /etc/nginx/conf.d/auth_request.conf;
            include /etc/nginx/conf.d/extract_token.conf;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        location @dicomweb_partage {
            auth_request /_verify-share;
            error_page 401 403 @error403;   # no =: keeps the status, see further down

            # Orthanc reads the token from this header (TokenHttpHeaders in
            # orthanc.json). That is what lets it enforce the share's SCOPE:
            # its plugin calls /tokens/validate, and check_resource_access
            # limits access to the resources the token really covers. Division
            # of roles: nginx checks that the token exists and has not expired,
            # Orthanc decides what it opens.
            #
            # So extract_token.conf is certainly not included here: it empties
            # this header, which made the request anonymous -- nginx let it
            # through, and Orthanc refused it behind with an inexplicable 403.
            proxy_set_header auth-token $arg_token;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }
        
        # =====================================================================
        # Programmatic upload endpoint (bypasses Authelia SSO)
        # =====================================================================
        # Dedicated path for automated scripts to POST DICOM files.
        # Auth = HTTP Basic (htpasswd generated by entrypoint from
        # UPLOAD_USER / UPLOAD_PASSWORD env vars). If those env vars are unset,
        # /etc/nginx/htpasswd is absent and all requests here will 500
        # (intentional fail-closed behavior).
        #
        # Client usage:
        #   curl -u $UPLOAD_USER:$UPLOAD_PASSWORD --data-binary @file.dcm \
        #        -H "Content-Type: application/dicom" \
        #        https://${DOMAIN}/api-upload/instances
        # Accepts a single DICOM file OR a ZIP archive of multiple DICOMs.
        # =====================================================================
        # Verification endpoint for the Cloudflare Access chain. Exact match, so
        # it takes precedence over the regex below, and it proxies nothing: a
        # 204 means the assertion Cloudflare relayed was accepted by
        # auth-service, a 403 that it was not. It lives under /api-upload/
        # because that is what the Access application covers -- outside that
        # path Cloudflare relays no assertion at all.
        # Safe to leave in place: it exposes no data and reaches no backend.
        location = /api-upload/_cf-check {
            auth_request /_verify-cf;
            # Deliberately not `return 204`: return runs in the rewrite phase,
            # before the access phase where auth_request lives, so the check
            # would be skipped entirely and every request would answer 204 --
            # a false positive that looks exactly like success. Proxying to a
            # harmless endpoint keeps the request in the access phase.
            proxy_pass http://auth_service/health;
        }

        location ~ ^/api-upload/(instances)(?:/|$) {
            # Auth strategy:
            #   - Cloudflare Access in front of the public domain (${DOMAIN}) enforces a
            #     service token (CF-Access-Client-Id / CF-Access-Client-Secret).
            #     Without those headers the request never reaches nginx.
            #   - Authelia SSO is explicitly OFF (`auth_request off`) so a
            #     scripted upload doesn't need a browser session.
            #   - Orthanc Authorization plugin gates the actual upload via the
            #     anonymous profile (permissions=["upload"], labels=["*"]) the
            #     auth-service returns; see services/auth-service/sources/
            #     auth_service.py:get_user_profile.
            #   - auth_basic + htpasswd would be a defense-in-depth extra layer
            #     but on nginx 1.28 it triggered a still-unexplained 403 (auth
            #     phase passed, $remote_user was set in the access log, yet the
            #     request never reached Orthanc). See commit 13ef1af for the
            #     bisection that isolated auth_basic as the trigger. Leaving it
            #     off until that's understood. CF Access is the real edge auth.
            # Authelia SSO stays off: a scripted upload has no browser session.
            # What gates this path instead is the Cloudflare Access assertion,
            # verified at the origin by auth-service -- so a request that reaches
            # nginx by some other route than the tunnel carries none and is
            # refused here.
            auth_request /_verify-cf;

            access_log /var/log/nginx/api-upload-probe.log upload_probe;

            # DICOM CDs can exceed the global 2g cap
            client_max_body_size 4g;
            proxy_read_timeout   600s;
            proxy_send_timeout   600s;

            rewrite ^/api-upload/(.*)$ /$1 break;
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;

            # Strip the client's Authorization header before proxying.
            #
            # This is the explanation of the 403 the comment above called
            # unexplained: when the client sends an Authorization header (the
            # case as soon as auth_basic is active, but also for a `curl -u` on
            # this route), nginx relays it as is to Orthanc. Orthanc has its
            # own HTTP authentication and rejects credentials it does not know
            # -- the 403 therefore comes from Orthanc, not from nginx, which
            # made the diagnosis misleading: the authentication phase passed,
            # $remote_user was set in the log, and the request never reached
            # its destination.
            #
            # This line also makes auth_basic reusable here, should that
            # defence-in-depth layer one day be put back in front of Cloudflare
            # Access.
            proxy_set_header Authorization "";

            # No user token is injected here on purpose: the request reaches
            # Orthanc fully ANONYMOUS. With Authorization plugin v0.10.0+, the
            # plugin then asks the auth-service for the anonymous user profile,
            # which is configured to grant ONLY 'upload' (defense in depth:
            # POST /instances works, but no read / list / delete / share, even
            # if the htpasswd or CF Access service token leaks).
            # See services/auth-service/sources/auth_service.py:get_user_profile.
        }

        # Orthanc REST API
        location ~ ^/(instances|patients|series|studies|tools|system|statistics|modalities|peers|plugins|jobs|changes|exports|preview|shares|shared|publish)(?:/|$) {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
            include /etc/nginx/conf.d/cors_headers.conf;
        }

        # Authelia authentication endpoints
        
        # Token management interface
        location /auth/tokens/manage {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://auth_service/tokens/manage;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        # Token statistics endpoint
        location /auth/tokens/stats {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://auth_service/tokens/stats;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        # Expired tokens endpoint
        location /auth/tokens/expired {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://auth_service/tokens/expired;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        # Authorization plugin token endpoints
        location ^~ /auth/tokens {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://auth_service/tokens;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        # =====================================================================
        # ADMIN / SETUP PANEL (auth-service)
        # =====================================================================
        # Same pattern as /auth/tokens above: without these blocks, /auth/admin
        # and /api/admin/ fall into the /auth/ and /api/ locations that point at
        # Authelia, and answer 404.

        # Administration panel (HTML + JSON API)
        location ^~ /auth/admin {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_headers.conf;
            # No auth_headers.conf include here: it puts $groups into
            # Remote-User, whereas admin_module.require_admin uses it as the
            # actor identity in the audit log. It needs $user.
            proxy_set_header Remote-User   $user;
            proxy_set_header Remote-Groups $groups;
        }

        location ^~ /api/admin/ {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_headers.conf;
            proxy_set_header Remote-User   $user;
            proxy_set_header Remote-Groups $groups;
            # Host WITH the port, for auth-service's CSRF origin check.
            # proxy_headers.conf sets Host = $domaine_effectif, without the
            # port: on a local installation (30443), the browser's origin
            # https://pacs.localhost:30443 matched nothing and EVERY panel
            # write answered 403 -- creating an account, changing a password.
            # Found in a browser on 2026-09-13. Invisible behind Cloudflare, on
            # 443.
            proxy_set_header X-Forwarded-Host $hote_connexion;
        }

        # First-run wizard: deliberately OUTSIDE SSO. At first launch no account
        # exists yet, so requiring an Authelia session would make setup
        # impossible. Closing it is handled on the auth-service side by the
        # setup_gate middleware, which redirects to /auth/admin as soon as setup
        # is finalised.
        location ^~ /auth/setup {
            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # Assets of the Authelia sign-in page.
        #
        # Authelia does not know it is served under /auth/: its page references
        # its files relatively ("./static/js/..."), which the browser resolves
        # to /auth/static/js/... Without these two blocks, those requests fall
        # into the /auth/static/ below -- meant for auth-service's files --
        # which answers 404: the sign-in page's HTML arrives, its JavaScript
        # does not, and the user sees a blank page with no message.
        #
        # nginx keeps the longest prefix, so these two blocks take precedence
        # over /auth/static/ without having to modify it.
        location ^~ /auth/static/js/ {
            satisfy any;
            allow all;

            proxy_pass http://authelia/static/js/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/remove_csp.conf;

            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location ^~ /auth/static/css/ {
            satisfy any;
            allow all;

            proxy_pass http://authelia/static/css/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/remove_csp.conf;

            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Auth service static files
        location ^~ /auth/static/ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs

            proxy_pass http://auth_service/static/;
        }

        # Redirect /auth to /auth/
        location = /auth {
            return 302 /auth/;
        }

        # Authelia authentication interface
        location /auth/ {
            # The sign-in page must be reachable WITHOUT being authenticated,
            # otherwise you would already have to be signed in to sign in.
            # auth_request is global here: conf.d/auth_request.conf is pulled
            # in by the http-level `include conf.d/*.conf`, and
            # auth_request is valid in http context -- so it applies to EVERY
            # route that does not opt out. It is the idiom already used by
            # /auth/static/, /ohif/*.js, /static/ and /locales.
            #
            # Added on 2026-08-24: /auth/ had been answering 401 since 21
            # August (946 occurrences in the log against 3 responses 200), so
            # signing in from the portal was impossible.
            satisfy any;
            allow all;

            limit_req zone=auth burst=15 nodelay;

            proxy_pass http://authelia/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/remove_csp.conf;
            include /etc/nginx/conf.d/security_headers_authelia.conf;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Forwarded-Proto https;
            # Port included: see the $hote_connexion map.
            proxy_set_header X-Forwarded-Host $hote_connexion;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Inject CSS to hide password reset link
            #
            # The "forgot password" link used to be HIDDEN here, with CSS.
            # Hiding is not disabling: the flow remained reachable by typing
            # the address, and it led to a lie -- Authelia's notifier is
            # `filesystem`, it writes the link into a file inside the container
            # and still announces "an e-mail has been sent" although no SMTP
            # exists. It is now closed at the source, by
            # authentication_backend.password_reset.disable in
            # configuration.yml, and Authelia no longer shows the link by
            # itself.
            sub_filter_once on;
        }
        
        # Authelia API endpoints
        location /api/ {
            # Same reason as /auth/ above: the sign-in form calls /api/state,
            # /api/configuration then /api/firstfactor BEFORE a session exists.
            # Gate those calls behind auth_request and the page shows without
            # ever being able to submit. Authelia applies its own checks on
            # these endpoints, which are designed to be exposed to the portal.
            #
            # Does not concern /api/admin/: declared with `^~` further up, a ^~
            # prefix wins, that route stays authenticated.
            satisfy any;
            allow all;

            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://authelia/api/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            proxy_set_header Cookie $http_cookie;
        }

        # Internal authentication verification endpoint
        location /authelia/ {
            internal;
            proxy_pass http://authelia/api/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URL https://$domaine_effectif$request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Cookie $http_cookie;
        }

        # Internal endpoint backing auth_request on /api-upload/.
        #
        # Cloudflare Access authenticates the service token at the edge; this
        # asks auth-service to check the very same headers against the pair
        # stored in Redis, so a token that Cloudflare still accepts but that we
        # have rotated away from no longer gets in. auth-service answers 204 to
        # allow, 403 on mismatch or when Redis is down (fail closed), and 503
        # when no pair has been stored -- which is why the auth_request line on
        # /api-upload/ must only be enabled once the pair exists, or every
        # upload breaks at once.
        location = /_verify-cf {
            internal;
            proxy_pass http://auth_service/api/internal/verify-cf;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # Relayed under non-CF names so they cannot be confused with headers
            # Cloudflare itself might set further down the chain.
            proxy_set_header X-CF-Client-Id     $http_cf_access_client_id;
            proxy_set_header X-CF-Client-Secret $http_cf_access_client_secret;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 2s;
            proxy_connect_timeout 1s;
        }

        # Validation of a share token, for /dicom-web and /wado.
        #
        # `internal`: reachable only through an nginx subrequest, never from
        # outside -- otherwise it would offer an oracle for testing tokens at
        # will.
        #
        # The token is passed as an explicit parameter rather than left to what
        # the subrequest inherits: what holds here must be readable here.
        # auth-service answers 204 when the token exists, has not expired and
        # has not exhausted its quota; 403 otherwise. It does NOT count usage
        # -- this endpoint is called on every viewer request, hundreds of times
        # per study viewed.
        location = /_verify-share {
            internal;
            proxy_pass http://auth_service/api/internal/verify-share;

            # The ORIGINAL URI is relayed and auth-service reads the token from
            # it. $arg_token does not do: in the context of an auth_request
            # subrequest it comes out EMPTY, and the token never arrived --
            # auth-service logged "verify-share?token=" without a value, and
            # every valid share was refused. $request_uri, on the other hand,
            # stays the client request's. Found on the test bench on
            # 2026-08-27.
            proxy_set_header X-Original-URI $request_uri;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 2s;
            proxy_connect_timeout 1s;
        }

        # Additional services

        # Authelia manifest.json
        location = /manifest.json {
            proxy_pass http://authelia/manifest.json;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # Authelia authenticated endpoint
        location /authenticated {
            proxy_pass http://authelia/authenticated;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # Root favicon
        location = /favicon.ico {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            rewrite ^/favicon\.ico$ /ui/app/favicon.ico break;
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # A ^/(manifest\.json)$ regex lived here, an unreachable duplicate:
        # `location = /manifest.json` is an EXACT match, and nginx evaluates
        # those first, never examining the regular expressions afterwards.
        # Removed.

        # =============================================================================
        # ERROR HANDLING
        # =============================================================================

        # Redirect to Authelia login page when not authenticated
        location @authelia_redirect {
            # $hote_connexion rather than $domaine_effectif: see the map.
            return 302 https://$hote_connexion/auth/?rd=$scheme://$http_host$request_uri;
        }

        # Handle 401 Unauthorized errors
        location @error401 {
            if ($http_accept ~ "application/json") {
                add_header Content-Type "application/json" always;
                return 401 '{"error": "Authentication required", "message": "Please login to access this resource"}';
            }
            root /usr/share/nginx/error_pages;
            try_files /401.html =401;
            internal;
        }

        # Handle 403 Forbidden errors
        location @error403 {
            if ($http_accept ~ "application/json") {
                add_header Content-Type "application/json" always;
                return 403 '{"error": "Access forbidden", "message": "You do not have permission to access this resource"}';
            }
            # An HTML page is only served to a request that expects one. nginx
            # refuses to return a static file to a POST and answers 405 "Method
            # Not Allowed": a refused POST therefore announced an invalid
            # method instead of an access refusal -- measured on 2026-08-29 on
            # a DICOM upload without a Cloudflare assertion. The script that
            # uploads the images logs that code: it would have sent people
            # looking for a method problem where there was a refusal.
            if ($request_method != GET) {
                return 403;
            }
            root /usr/share/nginx/error_pages;
            try_files /403.html =403;
            internal;
        }

        # Handle 404 Not Found errors
        location @error404 {
            root /usr/share/nginx/error_pages;
            try_files /404.html =404;
            internal;
        }

        # Handle 500 Internal Server errors
        location @error500 {
            root /usr/share/nginx/error_pages;
            try_files /500.html =500;
            internal;
        }

        # Handle 502/503/504 Gateway errors
        location @error502 {
            root /usr/share/nginx/error_pages;
            try_files /502.html =502;
            internal;
        }

        # Custom error pages
        #
        # TWO REGIMES for the 401, and it is intended -- not an inconsistency.
        #
        # This line is the server default: @error401 returns JSON to clients
        # asking for JSON, a page otherwise. That is what a DATA route needs:
        # an API call must receive a code, not a redirect it will not know how
        # to follow.
        #
        # PAGE routes redeclare `error_page 401 = @authelia_redirect` at their
        # own level, through conf.d/auth_request.conf: a browser lands on the
        # sign-in form there rather than on an error. An error_page declared
        # further down replaces the one above, it never adds to it -- hence the
        # visible difference between /ui/app/ (302) and /authenticated (401).
        #
        # Worth knowing: @error401 serves nginx's built-in 401 page and not
        # error_pages/401.html, `try_files` not working inside a named
        # location. A known cosmetic defect, not fixed: changing the error-page
        # routing of a PACS in service for a matter of appearance would be a
        # poor trade-off.
        #
        # WATCH the = sign: it must NOT be there.
        #
        # `error_page 403 = @error403` makes the response adopt the status of
        # the location it redirects to -- that is, 200, since 403.html is
        # served successfully. The refusal therefore went out to the client
        # with a SUCCESS code, looking like an error only in the page's
        # appearance.
        #
        # Measured on 2026-08-29: GET /api-upload/instances without a
        # Cloudflare assertion rendered the "Access Forbidden" page with an
        # HTTP 200. A browser shows the refusal and nobody notices anything; a
        # script, a probe or an audit reads 200 and concludes all is well.
        #
        # Without the =, nginx keeps the original status: a 403 stays a 403.
        error_page 401 @error401;
        error_page 403 @error403;
        error_page 404 @error404;
        error_page 500 @error500;
        error_page 502 503 504 @error502;
        
        
        # Orthanc logo for error pages
        location = /orthanc-logo.png {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            root /usr/share/nginx/logo;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Catch-all for undefined routes
        location / {
            include /etc/nginx/conf.d/auth_request.conf;
            return 401;
        }
    }
}