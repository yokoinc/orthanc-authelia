# =============================================================================
# NGINX SSL CONFIGURATION FOR ORTHANC-AUTHELIA
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 2g;

    # SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP stapling : DESACTIVE, et ce n'est pas un oubli.
    #
    # Le certificat de ce serveur est auto-signe (il ne sert qu'entre le tunnel
    # Cloudflare et nginx). Il n'a donc pas d'emetteur a interroger, et nginx le
    # disait a chaque demarrage :
    #
    #   [warn] "ssl_stapling" ignored, issuer certificate not found
    #
    # L'agrafage ne se faisait pas ; seul l'avertissement etait reel. Du bruit
    # recurrent dans les journaux est ce qui fait rater un vrai message -- on le
    # retire plutot que d'apprendre a ne plus le lire.
    #
    # Si un jour ce serveur porte un certificat signe par une autorite, remettre
    # ces deux lignes ET ajouter ssl_trusted_certificate, sans quoi le meme
    # avertissement reviendra.
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # La table de hachage des en-tetes transmis aux upstreams.
    #
    # nginx se plaignait a chaque demarrage :
    #   [warn] could not build optimal proxy_headers_hash, you should increase
    #          either proxy_headers_hash_max_size: 512 ...
    #
    # Cette pile ajoute beaucoup d'en-tetes (Authelia, Cloudflare, DICOMweb) et
    # depasse la table par defaut. nginx s'en sort, mais en degradant sa
    # recherche -- et en le signalant a chaque fois.
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript 
               application/xml+rss application/rss+xml 
               application/atom+xml image/svg+xml;

    # --- Adresse reelle du visiteur ---------------------------------------
    #
    # Tout le trafic public entre par le conteneur du tunnel Cloudflare, donc
    # $remote_addr vaut TOUJOURS son adresse sur le reseau Docker. Les zones
    # ci-dessous comptaient donc sur une seule et meme cle pour l'installation
    # entiere : le quota d'une personne etait le quota de tout le monde.
    #
    # Constate le 2026-08-28 : un clic sur « Deconnexion » renvoyait une page
    # 502. Ce n'etait pas une panne -- limit_req repond 503, et l'error_page
    # plus bas mappe 503 vers 502.html. Le portail depassait simplement son
    # quota tout seul.
    #
    # set_real_ip_from est volontairement limite au sous-reseau Docker : seul
    # le tunnel peut renseigner cet en-tete. Une requete qui arrive directement
    # du LAN n'a pas de CF-Connecting-IP et garde son adresse source.
    #
    # DOIT correspondre au `ipam.config.subnet` du reseau orthanc-network dans
    # docker-compose.yml. Ce sous-reseau y est EPINGLE, il ne derive donc pas
    # tout seul -- mais si vous le changez la-bas, changez-le ici : sinon
    # l'en-tete cesse d'etre pris en compte, sans le moindre message, et les
    # quotas redeviennent communs a toute l'installation comme avant.
    set_real_ip_from 192.168.80.0/20;
    real_ip_header CF-Connecting-IP;

    # Rate limiting
    #
    # 5r/m sur /auth/ etait intenable meme pour une seule personne : afficher le
    # portail, se connecter puis se deconnecter depasse le quota a soi seul.
    # Ce limiteur n'est PAS la protection contre les attaques par dictionnaire
    # -- c'est le role de `regulation` cote Authelia (3 essais, 5 min, bannissement
    # 15 min, et il persiste en base). Ici on ne veut qu'un garde-fou grossier
    # contre un client emballe.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    # 429 « Too Many Requests » plutot que le 503 par defaut, qui se faisait
    # repeindre en « 502 Service Unavailable » et faisait chercher une panne
    # de serveur la ou il n'y avait qu'un quota.
    limit_req_status 429;

    # Include additional configurations
    #
    # ATTENTION : ce glob aspire AUSSI conf.d/auth_request.conf, qui contient
    # `auth_request`. Cette directive etant valide en contexte http, elle
    # s'appliquait a TOUTES les routes sans que rien ne le dise -- et c'est
    # ce qui a verrouille la page de connexion pendant trois jours : /auth/
    # heritait de l'authentification, il fallait donc etre connecte pour
    # atteindre le formulaire de connexion.
    #
    # Le comportement est conserve : refus par defaut, une route nouvelle est
    # protegee tant qu'elle ne s'en extrait pas. C'est le bon defaut pour un
    # PACS. Mais il est desormais DECLARE ci-dessous, la ou on le lit.
    include /etc/nginx/conf.d/*.conf;

    # =========================================================================
    # AUTHENTIFICATION PAR DEFAUT
    # =========================================================================
    # Toute route est protegee sauf mention contraire. Une route qui doit etre
    # publique s'en extrait explicitement par `satisfy any; allow all;` --
    # c'est ce que font /auth/, /api/, /static/, /locales, /auth/static/ et les
    # fichiers d'OHIF. Une route qui a besoin d'un AUTRE validateur redeclare
    # `auth_request` a son niveau : /_verify-share pour les liens de partage,
    # /_verify-cf pour le depot programmatique.
    #
    # Oublier d'ouvrir une route la rend inaccessible ; oublier de fermer une
    # route exposerait des donnees de patients. Le defaut penche donc du bon
    # cote, et c'est deliberé.
    auth_request /authelia/;
    
    # =============================================================================
    # UPSTREAM SERVERS
    # =============================================================================
    upstream orthanc {
        server orthanc:8042;
    }

    upstream authelia {
        server authelia:9091;
    }

    upstream auth_service {
        server auth-service:8000;
    }

    upstream ohif {
        server ohif:8080;
    }

    # =============================================================================
    # TOKEN MAPPING
    # =============================================================================
    map $groups $auth_token {
        ~admin    "admin-token";
        ~doctor   "doctor-token";
        ~external "external-token";
        default   "";
    }

    # Probe for the /api-upload/ path: records whether Cloudflare relays the
    # service-token headers to the origin, without ever logging their value.
    # The client id is not secret, but there is no reason to write it down, and
    # presence is the only thing being established here.
    map $http_cf_access_client_id $cf_id_present {
        ""        "no";
        default   "yes";
    }
    map $http_cf_access_client_secret $cf_secret_present {
        ""        "no";
        default   "yes";
    }
    # Cloudflare Access consumes the service-token headers and injects a signed
    # assertion instead; this records which of the two actually arrives.
    map $http_cf_access_jwt_assertion $cf_jwt_present {
        ""        "no";
        default   "yes";
    }
    log_format upload_probe '$remote_addr [$time_local] "$request" $status '
                            'cf_id=$cf_id_present cf_secret=$cf_secret_present '
                            'cf_jwt=$cf_jwt_present cf_ray=$http_cf_ray';

    # Drives the "Administration" entry injected into the OE2 sidebar. The panel
    # itself re-checks the group, but a button leading to a 403 is worse than no
    # button, so non-admins never get it rendered.
    map $groups $show_admin_menu {
        ~admin    "true";
        default   "false";
    }

    # =========================================================================
    # DOMAINE EFFECTIF
    # =========================================================================
    # nginx s'adapte au domaine demande par le client, au lieu de le figer.
    #
    # ${DOMAIN} etait substitue par envsubst AU DEMARRAGE du conteneur. Changer
    # de domaine imposait donc de RECREER nginx -- un simple redemarrage garde
    # l'ancienne valeur, la variable d'environnement etant figee a la creation.
    # $host est evalue a chaque requete : le domaine suit desormais tout seul.
    #
    # $host, et non $http_host : nginx en retire le port, et un cookie n'en
    # porte jamais (RFC 6265). Authelia rejette un domaine qui ne correspond
    # pas a sa configuration de cookie -- c'est exactement l'erreur qui a rendu
    # cette installation inutilisable trois jours durant.
    #
    # Le repli existe pour l'acces par ADRESSE IP. Les sondes de supervision
    # interrogent https://192.168.1.100:30443 : sans repli, Authelia recevrait
    # un Host numerique, le refuserait, et la sonde passerait au rouge sans
    # qu'aucun service ne soit en panne. Ce repli reste fige au demarrage, mais
    # il ne concerne que ce chemin-la.
    map $host $domaine_effectif {
        default                    $host;
        "~^\d{1,3}(\.\d{1,3}){3}$" ${DOMAIN};
        localhost                  ${DOMAIN};
    }

    # =============================================================================
    # HTTP TO HTTPS REDIRECT SERVER
    # =============================================================================
    server {
        listen 80;
        server_name _;
        
        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =============================================================================
    # MAIN HTTPS SERVER
    # =============================================================================
    server {
        listen 443 ssl;
        server_name _;

        # SSL
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Buffer configuration
        large_client_header_buffers 8 16k;
        client_body_buffer_size 128k;
        client_header_buffer_size 4k;
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
        
        # Security headers (centralized configuration)
        include /etc/nginx/conf.d/security_headers.conf;
        etag off;

        # Relative redirects (Location: /ui/app/ instead of
        # https://host:443/ui/app/). nginx listens on 443 inside the
        # container while Docker publishes on 30443, so an absolute redirect
        # sends the browser to a closed port -- reaching the stack by IP,
        # https://host:30443/ answered 302 towards https://host/ui/app/ and
        # died there. Relative keeps whatever origin the browser already uses,
        # which is also what makes the domain and the IP behave the same.
        absolute_redirect off;

        # Root redirection - always redirect to UI, let UI handle authentication
        location = / {
            return 302 /ui/app/;
        }

        # Static assets (no authentication required)
        
        # Authelia static assets
        location ~ ^/static/?(.*)$ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://authelia/static/$1;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/remove_csp.conf;
            
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        
        # Orthanc Explorer 2 favicon for app path requests
        location ~ ^/app/.*favicon\.ico$ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            rewrite ^/app/.*favicon\.ico$ /ui/app/favicon.ico break;
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Alias historique vers le visualiseur. /app/X arrive sur / du conteneur
        # OHIF, qui sert sous /ohif/ : le repli SPA renvoie donc index.html.
        #
        # Cette route n'avait AUCUNE authentification. Elle repondait 401, mais
        # par accident : le conteneur OHIF refuse le listage de repertoire,
        # proxy_intercept_errors intercepte, et la page d'erreur passe par
        # Authelia. Aucune regle ne decidait de la proteger -- un chemin qui
        # aurait servi un fichier au lieu d'un repertoire serait sorti en clair.
        # Sur 48 h de journaux : une seule requete, depuis un scanner externe.
        # On l'aligne sur /ohif/ plutot que de la supprimer, la regle du favicon
        # juste au-dessus s'appuyant sur ce prefixe.
        location /app/ {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://ohif/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;
        }
        
        # Authelia locales
        location = /locales {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://authelia/locales;
            include /etc/nginx/conf.d/proxy_headers.conf;
            expires 1h;
            add_header Cache-Control "public";
        }
        
        # Authelia locale files
        location ~ ^/locales/[^/]+/[^/]+\.json$ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://authelia$request_uri;
            include /etc/nginx/conf.d/proxy_headers.conf;
            expires 1h;
            add_header Cache-Control "public";
        }

        # ---------------------------------------------------------------------
        # RETIREE le 2026-08-23 : cette regle court-circuitait Authelia.
        #
        # Etant une expression reguliere declaree tot dans le fichier, elle
        # captait TOUTE URL finissant par .js/.css/.png/.json/... avant que les
        # routes authentifiees ne soient examinees, et l envoyait a Orthanc sans
        # authentification. Mesure avant retrait :
        #     /ui/          -> 302 Authelia   |  /ui/app/zzz.js  -> 200 Orthanc
        #     /dicom-web/   -> 302 Authelia   |  /dicom-web/zzz.js -> 403 Orthanc
        #     /studies/     -> 302 Authelia   |  /studies/zzz.js -> 403 Orthanc
        # Seul le greffon d autorisation d Orthanc refusait ces requetes : la
        # protection etait dans le PACS, pas dans le reverse proxy.
        #
        # Elle servait les fichiers statiques d Orthanc Explorer 2. Inutile :
        # /ui/ est deja une route authentifiee qui sert ses propres fichiers.
        # ---------------------------------------------------------------------
        #         # General static assets
        #         location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|json|gz|wasm|woff|woff2|ttf|eot|map)$ {
        #             satisfy any;                    # Allow access without authentication
        #             allow all;                      # Allow all IPs
        #             
        #             proxy_pass http://orthanc;
        #             include /etc/nginx/conf.d/proxy_headers.conf;
        #             
        #             expires 1y;
        #             add_header Cache-Control "public, immutable";
        #         }

        # Authenticated application routes
        
        # Shared studies access (exact match for highest priority)  
        location = /share/ {
            auth_request off;               # Explicitly disable authentication
            proxy_pass http://auth_service/share/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/security_headers.conf;
        }
        
        # Deux routes vivaient ici, /share/api/ et
        # ^/share/(studies|series|instances|...)$, heritees d'une page de
        # partage qui allait chercher les donnees elle-meme. Retirees : plus
        # rien ne les appelle.
        #
        # Le flux actuel ne les traverse pas. /share/?token=X valide le jeton
        # (auth_service.py, share_redirect) puis REDIRIGE vers le visualiseur
        # -- /ohif/, /stone-webviewer/index.html ou /volview/index.html -- avec
        # le jeton en parametre. Ce sont ensuite les appels /dicom-web et /wado
        # du visualiseur qui portent l'acces, valides par /_verify-share.
        #
        # Verifie avant retrait : zero reference dans tout le depot (py, js,
        # html, json) et aucun trafic au journal hors mes propres sondes.
        
        # Orthanc web interface
        location /ui/ {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;

            # Extra sidebar entries (Partages, Administration, Deconnexion).
            # The code lives in oe2-menu.js, served unauthenticated from
            # /auth/static/: a config parameter cannot exceed 4096 bytes and the
            # inline version outgrew it. Only the admin flag stays here, since it
            # comes from the $groups map. Bump ?v= when oe2-menu.js changes.
            sub_filter '</head>' '<script>window.__OE2_IS_ADMIN__=$show_admin_menu;</script><script src="/auth/static/oe2-menu.js?v=4"></script></head>';
            sub_filter_once on;
        }
        
        # Stone WebViewer
        location /stone-webviewer/ {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }
        
        # VolView WebViewer
        location /volview/ {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }
        
        # OHIF static assets (all files except viewer pages)
        # app-config.js : JAMAIS en cache.
        #
        # Declare en `=` pour passer AVANT la regle des ressources statiques
        # ci-dessous, qui posait `expires 1y; Cache-Control: public, immutable`.
        # Or ce fichier n'est pas une ressource figee : c'est la configuration
        # d'OHIF, montee depuis l'hote et modifiee a la main. Avec un an
        # d'immuabilite, toute modification devenait invisible -- le navigateur
        # servait sa copie, et Cloudflare la sienne.
        #
        # Constate le 2026-08-29 : deux reglages changes et deployes, verifies
        # dans le conteneur, restaient sans le moindre effet. L'application
        # chargee lisait encore l'ancien fichier (cf-cache-status: HIT, age 4
        # jours, max-age 31536000). Une heure de diagnostic sur des correctifs
        # qui n'etaient jamais arrives jusqu'au navigateur.
        #
        # Les bundles, eux, gardent leur cache d'un an a juste titre : leur nom
        # porte une empreinte, un contenu different a une autre adresse.
        location = /ohif/app-config.js {
            satisfy any;
            allow all;

            proxy_pass http://ohif;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;

            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location ~ ^/ohif/(.+\.(js|css|png|jpe?g|gif|svg|ico|webp|json|gz|wasm|woff|woff2|ttf|eot|map|txt))$ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://ohif;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # OHIF viewer assets directory
        location ^~ /ohif/assets/ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            proxy_pass http://ohif;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # OHIF Viewer
        location /ohif/ {
            # Une regex identique existait ici, imbriquee. Elle etait
            # INATTEIGNABLE : nginx evalue les `location` en expression
            # reguliere du bloc `server` AVANT de retenir un prefixe, et
            # celle de la ligne 364 couvre exactement les memes extensions.
            # Une location imbriquee n'est examinee qu'une fois son parent
            # retenu -- ce qui n'arrive jamais pour ces fichiers.
            #
            # Retiree, en gardant celle qui sert reellement.

            # Require authentication for viewer pages
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://ohif;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
            include /etc/nginx/conf.d/cors_ohif.conf;
            proxy_intercept_errors on;

            # Contournement du cache Cloudflare deja constitue.
            #
            # app-config.js a ete servi pendant des mois avec
            # max-age=31536000, immutable. C'est corrige a l'origine (voir la
            # location = plus haut), mais la copie DEJA en cache au bord porte
            # toujours cet en-tete et ne sera pas revalidee : sans purge
            # manuelle, elle vivrait un an. Cloudflare indexant par URL,
            # ajouter un parametre suffit a la contourner definitivement -- la
            # nouvelle adresse n'a jamais ete vue, et ce qu'elle renvoie
            # desormais porte no-store, donc rien ne se remettra en cache.
            #
            # Le parametre n'a pas besoin de changer ensuite : c'est no-store
            # qui fait le travail. Il ne sert qu'a echapper a l'ancienne entree.
            #
            # Accept-Encoding vide : sub_filter ne sait pas reecrire une reponse
            # compressee, elle passerait telle quelle sans un mot.
            proxy_set_header Accept-Encoding "";
            sub_filter 'app-config.js' 'app-config.js?v=2';
            sub_filter_once on;
        }

        # DICOM API endpoints (authenticated)
        
        # WADO (Web Access to DICOM Objects)
        # Session OU jeton de partage : $point_auth choisit le validateur selon
        # la presence de ?token=. Les directives sont posees ici plutot que par
        # `include auth_request.conf`, dont la cible est figee sur Authelia --
        # et qu'on ne peut pas dupliquer en variante, un fichier depose dans
        # conf.d/ etant aussi aspire au niveau http par le include de la ligne
        # 63, ce qui l'appliquerait a TOUTES les routes.
        # Une requete arrive ici de deux facons legitimes : depuis un
        # utilisateur connecte (cookie de session), ou depuis un lien de
        # partage (?token=...). Il faut donc deux validateurs differents.
        #
        # `auth_request $variable` NE MARCHE PAS : la directive n'interpole
        # pas les variables, nginx cherche litteralement un fichier nomme
        # "$point_auth" et repond 403. Constate au banc d'essai.
        #
        # On bascule donc vers une LOCATION NOMMEE, qui preserve $uri et les
        # arguments -- un `rewrite` les perdrait. Le 418 ne sort jamais sur le
        # reseau : il sert uniquement de signal interne vers @partage.
        location /wado {
            error_page 418 = @wado_partage;
            if ($arg_token) { return 418; }

            include /etc/nginx/conf.d/auth_request.conf;
            include /etc/nginx/conf.d/extract_token.conf;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        location @wado_partage {
            auth_request /_verify-share;
            error_page 401 403 @error403;   # sans = : conserve le statut, cf. plus bas

            # Orthanc lit le jeton dans cet en-tete (TokenHttpHeaders de
            # orthanc.json). C'est ce qui lui permet d'appliquer le PERIMETRE
            # du partage : son greffon appelle /tokens/validate, et
            # check_resource_access limite l'acces aux ressources que le jeton
            # couvre reellement. Partage des roles : nginx verifie que le jeton
            # existe et n'est pas expire, Orthanc decide ce qu'il ouvre.
            #
            # On n'inclut donc surtout pas extract_token.conf ici : il vide cet
            # en-tete, ce qui rendait la requete anonyme -- nginx laissait
            # passer, et Orthanc refusait derriere avec un 403 inexplicable.
            proxy_set_header auth-token $arg_token;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # DICOM-Web API
        location /dicom-web {
            error_page 418 = @dicomweb_partage;
            if ($arg_token) { return 418; }

            include /etc/nginx/conf.d/auth_request.conf;
            include /etc/nginx/conf.d/extract_token.conf;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        location @dicomweb_partage {
            auth_request /_verify-share;
            error_page 401 403 @error403;   # sans = : conserve le statut, cf. plus bas

            # Orthanc lit le jeton dans cet en-tete (TokenHttpHeaders de
            # orthanc.json). C'est ce qui lui permet d'appliquer le PERIMETRE
            # du partage : son greffon appelle /tokens/validate, et
            # check_resource_access limite l'acces aux ressources que le jeton
            # couvre reellement. Partage des roles : nginx verifie que le jeton
            # existe et n'est pas expire, Orthanc decide ce qu'il ouvre.
            #
            # On n'inclut donc surtout pas extract_token.conf ici : il vide cet
            # en-tete, ce qui rendait la requete anonyme -- nginx laissait
            # passer, et Orthanc refusait derriere avec un 403 inexplicable.
            proxy_set_header auth-token $arg_token;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }
        
        # =====================================================================
        # Programmatic upload endpoint (bypasses Authelia SSO)
        # =====================================================================
        # Dedicated path for automated scripts to POST DICOM files.
        # Auth = HTTP Basic (htpasswd generated by entrypoint from
        # UPLOAD_USER / UPLOAD_PASSWORD env vars). If those env vars are unset,
        # /etc/nginx/htpasswd is absent and all requests here will 500
        # (intentional fail-closed behavior).
        #
        # Client usage:
        #   curl -u $UPLOAD_USER:$UPLOAD_PASSWORD --data-binary @file.dcm \
        #        -H "Content-Type: application/dicom" \
        #        https://${DOMAIN}/api-upload/instances
        # Accepts a single DICOM file OR a ZIP archive of multiple DICOMs.
        # =====================================================================
        # Verification endpoint for the Cloudflare Access chain. Exact match, so
        # it takes precedence over the regex below, and it proxies nothing: a
        # 204 means the assertion Cloudflare relayed was accepted by
        # auth-service, a 403 that it was not. It lives under /api-upload/
        # because that is what the Access application covers -- outside that
        # path Cloudflare relays no assertion at all.
        # Safe to leave in place: it exposes no data and reaches no backend.
        location = /api-upload/_cf-check {
            auth_request /_verify-cf;
            # Deliberately not `return 204`: return runs in the rewrite phase,
            # before the access phase where auth_request lives, so the check
            # would be skipped entirely and every request would answer 204 --
            # a false positive that looks exactly like success. Proxying to a
            # harmless endpoint keeps the request in the access phase.
            proxy_pass http://auth_service/health;
        }

        location ~ ^/api-upload/(instances)(?:/|$) {
            # Auth strategy:
            #   - Cloudflare Access in front of le domaine public (${DOMAIN}) enforces a
            #     service token (CF-Access-Client-Id / CF-Access-Client-Secret).
            #     Without those headers the request never reaches nginx.
            #   - Authelia SSO is explicitly OFF (`auth_request off`) so a
            #     scripted upload doesn't need a browser session.
            #   - Orthanc Authorization plugin gates the actual upload via the
            #     anonymous profile (permissions=["upload"], labels=["*"]) the
            #     auth-service returns; see services/auth-service/sources/
            #     auth_service.py:get_user_profile.
            #   - auth_basic + htpasswd would be a defense-in-depth extra layer
            #     but on nginx 1.28 it triggered a still-unexplained 403 (auth
            #     phase passed, $remote_user was set in the access log, yet the
            #     request never reached Orthanc). See commit 13ef1af for the
            #     bisection that isolated auth_basic as the trigger. Leaving it
            #     off until that's understood. CF Access is the real edge auth.
            # Authelia SSO stays off: a scripted upload has no browser session.
            # What gates this path instead is the Cloudflare Access assertion,
            # verified at the origin by auth-service -- so a request that reaches
            # nginx by some other route than the tunnel carries none and is
            # refused here.
            auth_request /_verify-cf;

            access_log /var/log/nginx/api-upload-probe.log upload_probe;

            # DICOM CDs can exceed the global 2g cap
            client_max_body_size 4g;
            proxy_read_timeout   600s;
            proxy_send_timeout   600s;

            rewrite ^/api-upload/(.*)$ /$1 break;
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;

            # Coupe l'en-tete Authorization du client avant transmission.
            #
            # C'est l'explication du 403 que le commentaire ci-dessus donnait
            # pour inexplique : quand le client envoie un Authorization (le cas
            # des que auth_basic est actif, mais aussi d'un `curl -u` sur cette
            # route), nginx le relaie tel quel a Orthanc. Orthanc a sa propre
            # authentification HTTP et rejette des identifiants qu'il ne connait
            # pas -- le 403 vient donc d'Orthanc, pas de nginx, ce qui rendait le
            # diagnostic trompeur : la phase d'authentification passait,
            # $remote_user etait renseigne dans le journal, et la requete
            # n'atteignait jamais sa destination.
            #
            # Cette ligne rend aussi auth_basic reutilisable ici, si on veut un
            # jour remettre cette couche en profondeur devant Cloudflare Access.
            proxy_set_header Authorization "";

            # No user token is injected here on purpose: the request reaches
            # Orthanc fully ANONYMOUS. With Authorization plugin v0.10.0+, the
            # plugin then asks the auth-service for the anonymous user profile,
            # which is configured to grant ONLY 'upload' (defense in depth:
            # POST /instances works, but no read / list / delete / share, even
            # if the htpasswd or CF Access service token leaks).
            # See services/auth-service/sources/auth_service.py:get_user_profile.
        }

        # Orthanc REST API
        location ~ ^/(instances|patients|series|studies|tools|system|statistics|modalities|peers|plugins|jobs|changes|exports|preview|shares|shared|publish)(?:/|$) {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
            include /etc/nginx/conf.d/cors_headers.conf;
        }

        # Authelia authentication endpoints
        
        # Token management interface
        location /auth/tokens/manage {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://auth_service/tokens/manage;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        # Token statistics endpoint
        location /auth/tokens/stats {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://auth_service/tokens/stats;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        # Expired tokens endpoint
        location /auth/tokens/expired {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://auth_service/tokens/expired;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        # Authorization plugin token endpoints
        location ^~ /auth/tokens {
            include /etc/nginx/conf.d/auth_request.conf;
            
            proxy_pass http://auth_service/tokens;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/auth_headers.conf;
        }

        # =====================================================================
        # ADMIN / SETUP PANEL (auth-service)
        # =====================================================================
        # Same pattern as /auth/tokens above: without these blocks, /auth/admin
        # and /api/admin/ fall into the /auth/ and /api/ locations that point at
        # Authelia, and answer 404.

        # Administration panel (HTML + JSON API)
        location ^~ /auth/admin {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_headers.conf;
            # No auth_headers.conf include here: it puts $groups into
            # Remote-User, whereas admin_module.require_admin uses it as the
            # actor identity in the audit log. It needs $user.
            proxy_set_header Remote-User   $user;
            proxy_set_header Remote-Groups $groups;
        }

        location ^~ /api/admin/ {
            include /etc/nginx/conf.d/auth_request.conf;

            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_headers.conf;
            proxy_set_header Remote-User   $user;
            proxy_set_header Remote-Groups $groups;
        }

        # First-run wizard: deliberately OUTSIDE SSO. At first launch no account
        # exists yet, so requiring an Authelia session would make setup
        # impossible. Closing it is handled on the auth-service side by the
        # setup_gate middleware, which redirects to /auth/admin as soon as setup
        # is finalised.
        location ^~ /auth/setup {
            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # Assets de la page de connexion Authelia.
        #
        # Authelia ignore qu'elle est servie sous /auth/ : sa page reference ses
        # fichiers en relatif ("./static/js/..."), ce qui resout cote navigateur
        # vers /auth/static/js/... Sans ces deux blocs, ces requetes tombent
        # dans le /auth/static/ ci-dessous -- destine aux fichiers d'auth-service
        # -- qui repond 404 : le HTML de la page de connexion arrive, son
        # JavaScript non, et l'utilisateur voit une page blanche sans message.
        #
        # nginx retient le prefixe le plus long, donc ces deux blocs priment sur
        # /auth/static/ sans avoir a le modifier.
        location ^~ /auth/static/js/ {
            satisfy any;
            allow all;

            proxy_pass http://authelia/static/js/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/remove_csp.conf;

            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        location ^~ /auth/static/css/ {
            satisfy any;
            allow all;

            proxy_pass http://authelia/static/css/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/remove_csp.conf;

            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Auth service static files
        location ^~ /auth/static/ {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs

            proxy_pass http://auth_service/static/;
        }

        # Redirect /auth to /auth/
        location = /auth {
            return 302 /auth/;
        }

        # Authelia authentication interface
        location /auth/ {
            # La page de connexion doit etre joignable SANS etre authentifie,
            # sinon il faut deja etre connecte pour pouvoir se connecter.
            # auth_request est global ici : conf.d/auth_request.conf est aspire
            # par le `include conf.d/*.conf` du niveau http (ligne 63), et
            # auth_request est valide en contexte http -- donc il s'applique a
            # TOUTE route qui ne s'en extrait pas. C'est l'idiome deja utilise
            # par /auth/static/, /ohif/*.js, /static/ et /locales.
            #
            # Ajoute le 2026-08-24 : /auth/ repondait 401 depuis le 21 aout
            # (946 occurrences au journal contre 3 reponses 200), la connexion
            # etait donc impossible depuis le portail.
            satisfy any;
            allow all;

            limit_req zone=auth burst=15 nodelay;

            proxy_pass http://authelia/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            include /etc/nginx/conf.d/remove_csp.conf;
            include /etc/nginx/conf.d/security_headers_authelia.conf;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $domaine_effectif;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Inject CSS to hide password reset link
            # Le lien « mot de passe oublie » etait MASQUE ici, en CSS. Cacher
            # n'est pas desactiver : le parcours restait atteignable en tapant
            # l'adresse, et il menait a un mensonge -- le notifier d'Authelia est
            # `filesystem`, il ecrit le lien dans un fichier du conteneur et
            # annonce quand meme « un e-mail a ete envoye » alors qu'aucun SMTP
            # n'existe. C'est desormais ferme a la source, par
            # authentication_backend.password_reset.disable dans configuration.yml,
            # et Authelia n'affiche plus le lien de lui-meme.
            sub_filter_once on;
        }
        
        # Authelia API endpoints
        location /api/ {
            # Meme raison que /auth/ ci-dessus : le formulaire de connexion
            # appelle /api/state, /api/configuration puis /api/firstfactor
            # AVANT qu'une session existe. Gate ces appels derriere
            # auth_request et la page s'affiche sans jamais pouvoir soumettre.
            # Authelia applique ses propres controles sur ces points d'entree,
            # qui sont concus pour etre exposes au portail.
            #
            # Ne concerne pas /api/admin/ : declare en `^~` plus haut, un
            # prefixe ^~ l'emporte, cette route reste authentifiee.
            satisfy any;
            allow all;

            limit_req zone=auth burst=10 nodelay;
            
            proxy_pass http://authelia/api/;
            include /etc/nginx/conf.d/proxy_headers.conf;
            proxy_set_header Cookie $http_cookie;
        }

        # Internal authentication verification endpoint
        location /authelia/ {
            internal;
            proxy_pass http://authelia/api/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URL https://$domaine_effectif$request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Cookie $http_cookie;
        }

        # Internal endpoint backing auth_request on /api-upload/.
        #
        # Cloudflare Access authenticates the service token at the edge; this
        # asks auth-service to check the very same headers against the pair
        # stored in Redis, so a token that Cloudflare still accepts but that we
        # have rotated away from no longer gets in. auth-service answers 204 to
        # allow, 403 on mismatch or when Redis is down (fail closed), and 503
        # when no pair has been stored -- which is why the auth_request line on
        # /api-upload/ must only be enabled once the pair exists, or every
        # upload breaks at once.
        location = /_verify-cf {
            internal;
            proxy_pass http://auth_service/api/internal/verify-cf;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            # Relayed under non-CF names so they cannot be confused with headers
            # Cloudflare itself might set further down the chain.
            proxy_set_header X-CF-Client-Id     $http_cf_access_client_id;
            proxy_set_header X-CF-Client-Secret $http_cf_access_client_secret;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 2s;
            proxy_connect_timeout 1s;
        }

        # Validation d'un jeton de partage, pour /dicom-web et /wado.
        #
        # `internal` : joignable uniquement par une sous-requete nginx, jamais
        # depuis l'exterieur -- sinon on offrirait un oracle permettant de
        # tester des jetons a volonte.
        #
        # Le jeton est passe en parametre explicite plutot que laisse a
        # l'heritage de la sous-requete : ce qui est vrai ici doit se lire ici.
        # auth-service repond 204 si le jeton existe, n'est pas expire et n'a
        # pas epuise son quota ; 403 sinon. Il NE decompte PAS l'usage -- ce
        # point d'entree est appele a chaque requete du visualiseur, soit des
        # centaines de fois par etude consultee.
        location = /_verify-share {
            internal;
            proxy_pass http://auth_service/api/internal/verify-share;

            # On relaie l'URI D'ORIGINE et auth-service y lit le jeton.
            # $arg_token ne convient pas : dans le contexte d'une sous-requete
            # auth_request il ressort VIDE, et le jeton n'arrivait jamais --
            # auth-service journalisait "verify-share?token=" sans valeur, et
            # tout partage valide etait refuse. $request_uri, lui, reste celui
            # de la requete cliente. Constate au banc d'essai le 2026-08-27.
            proxy_set_header X-Original-URI $request_uri;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 2s;
            proxy_connect_timeout 1s;
        }

        # Additional services

        # Authelia manifest.json
        location = /manifest.json {
            proxy_pass http://authelia/manifest.json;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # Authelia authenticated endpoint
        location /authenticated {
            proxy_pass http://authelia/authenticated;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }

        # Root favicon
        location = /favicon.ico {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            
            rewrite ^/favicon\.ico$ /ui/app/favicon.ico break;
            proxy_pass http://orthanc;
            include /etc/nginx/conf.d/proxy_headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Une regex ^/(manifest\.json)$ vivait ici, doublon inatteignable :
        # `location = /manifest.json` est une correspondance EXACTE, et nginx
        # les evalue en premier, sans jamais examiner les expressions
        # regulieres ensuite. Retiree.

        # =============================================================================
        # ERROR HANDLING
        # =============================================================================

        # Redirect to Authelia login page when not authenticated
        location @authelia_redirect {
            return 302 https://$domaine_effectif/auth/?rd=$scheme://$http_host$request_uri;
        }

        # Handle 401 Unauthorized errors
        location @error401 {
            if ($http_accept ~ "application/json") {
                add_header Content-Type "application/json" always;
                return 401 '{"error": "Authentication required", "message": "Please login to access this resource"}';
            }
            root /usr/share/nginx/error_pages;
            try_files /401.html =401;
            internal;
        }

        # Handle 403 Forbidden errors
        location @error403 {
            if ($http_accept ~ "application/json") {
                add_header Content-Type "application/json" always;
                return 403 '{"error": "Access forbidden", "message": "You do not have permission to access this resource"}';
            }
            # Une page HTML ne se sert qu'a une requete qui en attend une.
            # nginx refuse de rendre un fichier statique a un POST et repond
            # 405 « Method Not Allowed » : un POST refuse annoncait donc une
            # methode invalide au lieu d'un refus d'acces -- mesure le
            # 2026-08-29 sur un depot DICOM sans assertion Cloudflare. Le script
            # qui depose les images journalise ce code : il aurait envoye
            # chercher un probleme de methode la ou il y avait un refus.
            if ($request_method != GET) {
                return 403;
            }
            root /usr/share/nginx/error_pages;
            try_files /403.html =403;
            internal;
        }

        # Handle 404 Not Found errors
        location @error404 {
            root /usr/share/nginx/error_pages;
            try_files /404.html =404;
            internal;
        }

        # Handle 500 Internal Server errors
        location @error500 {
            root /usr/share/nginx/error_pages;
            try_files /500.html =500;
            internal;
        }

        # Handle 502/503/504 Gateway errors
        location @error502 {
            root /usr/share/nginx/error_pages;
            try_files /502.html =502;
            internal;
        }

        # Custom error pages
        #
        # DEUX REGIMES pour le 401, et c'est voulu -- pas une incoherence.
        #
        # Cette ligne-ci est le defaut du serveur : @error401 rend un JSON aux
        # clients qui demandent du JSON, une page sinon. C'est ce qu'il faut
        # pour une route de DONNEES : un appel d'API doit recevoir un code, pas
        # une redirection qu'il ne saura pas suivre.
        #
        # Les routes de PAGES redeclarent `error_page 401 = @authelia_redirect`
        # a leur niveau, via conf.d/auth_request.conf : un navigateur y arrive
        # sur le formulaire de connexion plutot que sur une erreur. Un
        # error_page declare plus bas remplace celui du dessus, jamais ne s'y
        # ajoute -- d'ou la difference visible entre /ui/app/ (302) et
        # /authenticated (401).
        #
        # A savoir : @error401 sert la page 401 integree de nginx et non
        # error_pages/401.html, `try_files` ne fonctionnant pas dans une
        # location nommee. Defaut cosmetique connu, non corrige : changer le
        # routage des pages d'erreur d'un PACS en service pour une question
        # d'apparence serait mal arbitre.
        # ATTENTION au signe = : il ne doit PAS etre la.
        #
        # `error_page 403 = @error403` fait adopter a la reponse le statut de la
        # location vers laquelle on renvoie -- soit 200, puisque 403.html est
        # servi avec succes. Le refus partait donc au client avec un code de
        # SUCCES, en n'ayant d'erreur que l'apparence de la page.
        #
        # Mesure le 2026-08-29 : GET /api-upload/instances sans assertion
        # Cloudflare rendait la page « Access Forbidden » avec un HTTP 200. Un
        # navigateur affiche le refus et personne ne voit rien ; un script, une
        # sonde ou un audit lisent 200 et concluent que tout va bien.
        #
        # Sans le =, nginx conserve le statut d'origine : un 403 reste un 403.
        error_page 401 @error401;
        error_page 403 @error403;
        error_page 404 @error404;
        error_page 500 @error500;
        error_page 502 503 504 @error502;
        
        
        # Orthanc logo for error pages
        location = /orthanc-logo.png {
            satisfy any;                    # Allow access without authentication
            allow all;                      # Allow all IPs
            root /usr/share/nginx/logo;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Catch-all for undefined routes
        location / {
            include /etc/nginx/conf.d/auth_request.conf;
            return 401;
        }
    }
}