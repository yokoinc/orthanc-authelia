<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orthanc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/auth/static/oe2-shared.css?v={asset_version}" rel="stylesheet">
    <style>
        .setup-wrap { max-width: 520px; margin: 60px auto; padding: 32px 28px;
                      background: var(--oe2-card-bg); border: 1px solid var(--oe2-border);
                      border-radius: 4px; color: var(--oe2-nav-color); }
        .setup-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .setup-wrap h1 { font-size: 20px; font-weight: 400; margin: 0 0 8px; }
        .setup-wrap .subtitle { color: var(--oe2-muted); font-size: 13px; margin-bottom: 24px; }
        .setup-wrap label { display: block; font-size: 12px; color: var(--oe2-muted);
                            margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .setup-wrap input { width: 100%; background: var(--oe2-nav-sub-bg);
                            border: 1px solid var(--oe2-border-subtle);
                            color: var(--oe2-nav-color); padding: 8px 10px;
                            border-radius: 3px; font-size: 13px; }
        .setup-wrap input:focus { border-color: var(--oe2-accent); outline: none; }
        .setup-wrap .hint { font-size: 11px; color: var(--oe2-muted); margin-top: 4px; }
        .setup-wrap .actions { margin-top: 24px; display: flex; justify-content: flex-end; }
        .setup-wrap .msg { margin-top: 16px; padding: 10px 12px; border-radius: 3px;
                           font-size: 12px; display: none; }
        .setup-wrap .msg--err { background: rgba(220,53,69,0.15);
                                border-left: 3px solid var(--oe2-danger); color: #ffb0b0; }
        .setup-wrap .msg--ok { background: rgba(40,167,69,0.15);
                               border-left: 3px solid var(--oe2-success); color: #b6f0c0; }
        .langues { display: flex; gap: 4px; flex-shrink: 0; }
        .langues button { background: transparent; border: 1px solid var(--oe2-border-subtle);
                          color: var(--oe2-muted); font-size: 11px; padding: 2px 8px;
                          border-radius: 3px; cursor: pointer; }
        .langues button[aria-pressed="true"] { color: var(--oe2-nav-color);
                                               border-color: var(--oe2-accent); }
    </style>
</head>
<body>
    <!-- Multilingual. The texts live in translations/<lang>.json, « setup »
         section (the CI checks that every language has the same keys), and
         arrive here through server rendering. Default language: the BROWSER's,
         that is, the person in front of the screen -- the host system's
         language, which bootstrap.sh guesses, answers "English" under
         WSL/Ubuntu even for a French-speaking user. The choice is saved on
         finalisation, for the rest of the installation. -->
    <div class="setup-wrap">
        <div class="setup-head">
            <h1><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> <span data-t="heading"></span></h1>
            <!-- One button per translations/*.json file, generated below. -->
            <div class="langues" id="langues" role="group" aria-label="Language"></div>
        </div>
        <p class="subtitle" data-t="subtitle"></p>

        <form id="setup-form" novalidate>
            <!-- No "login" field: the address IS the login, as in the panel.
                 The former field refused "@" and gave the first administrator a
                 login different from their address. Found on 2026-09-13.
                 Without a username, the server takes the address
                 (UserCreatePayload._resolve_identity). -->
            <label for="email" data-t="email_label"></label>
            <input type="email" id="email" name="email" required autocomplete="username">
            <div class="hint" data-t="email_hint"></div>

            <label for="displayname" data-t="displayname_label"></label>
            <input type="text" id="displayname" name="displayname" required maxlength="100"
                   autocomplete="name">

            <label for="password" data-t="password_label"></label>
            <input type="password" id="password" name="password" required minlength="12"
                   autocomplete="new-password">
            <div class="hint" data-t="password_hint"></div>

            <label for="password2" data-t="password2_label"></label>
            <input type="password" id="password2" name="password2" required minlength="12"
                   autocomplete="new-password">

            <div id="msg" class="msg" role="alert"></div>

            <div class="actions">
                <button type="submit" class="oe2-btn oe2-btn--primary" id="submit-btn" data-t="submit"></button>
            </div>
        </form>
    </div>

<script>
const TEXTES = {setup_i18n};
const LANGUES = {setup_langues};

const form = document.getElementById('setup-form');
const msg = document.getElementById('msg');
const btn = document.getElementById('submit-btn');

// Buttons generated from the available languages: a language added by
// dropping in a file shows up here without editing this page.
const zoneLangues = document.getElementById('langues');
LANGUES.forEach(l => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.langue = l.code;
    b.lang = l.code;
    b.textContent = l.code.toUpperCase();
    b.title = l.name;
    zoneLangues.appendChild(b);
});

// The browser's language when available, otherwise the installation's.
const langueNavigateur = (navigator.language || '').toLowerCase().split(/[-_]/)[0];
let langueCourante = TEXTES[langueNavigateur] ? langueNavigateur : {setup_langue};
if (!TEXTES[langueCourante]) langueCourante = Object.keys(TEXTES)[0];

function t(cle) {
    return (TEXTES[langueCourante] || {})[cle] || cle;
}

function appliquerLangue(langue) {
    langueCourante = langue;
    document.documentElement.lang = langue;
    document.title = t('page_title');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    form.email.placeholder = t('email_placeholder');
    form.displayname.placeholder = t('displayname_placeholder');
    form.password.placeholder = t('password_placeholder');
    document.querySelectorAll('[data-langue]').forEach(b => {
        b.setAttribute('aria-pressed', String(b.dataset.langue === langue));
    });
    msg.style.display = 'none';
}

document.querySelectorAll('[data-langue]').forEach(b => {
    b.addEventListener('click', () => appliquerLangue(b.dataset.langue));
});
appliquerLangue(langueCourante);

function showMsg(text, ok) {
    msg.className = 'msg msg--' + (ok ? 'ok' : 'err');
    msg.textContent = text;
    msg.style.display = 'block';
}

// Validation error (422): name the faulty field in the page's language rather
// than show the server's technical message, in English.
async function messageValidation(r) {
    try {
        const detail = (await r.json()).detail;
        const champs = Array.isArray(detail)
            ? detail.map(d => (d.loc || []).join('.')) : [];
        if (champs.some(c => c.endsWith('email'))) return t('err_email');
        if (champs.some(c => c.endsWith('password'))) return t('err_password');
        if (typeof detail === 'string') return detail;
    } catch (_) { /* reponse illisible */ }
    return t('err_generic');
}

async function detailServeur(r) {
    try {
        const d = (await r.json()).detail;
        if (typeof d === 'string') return d;
    } catch (_) { /* reponse illisible */ }
    return t('err_generic') + ' (HTTP ' + r.status + ')';
}

function termine() {
    showMsg(t('success'), true);
    setTimeout(() => { window.location.href = '/auth/admin'; }, 1500);
}

async function finaliser() {
    const r = await fetch('/auth/setup/finalize', {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({langue: langueCourante}),
    });
    if (r.ok) return termine();
    // 404: the wizard no longer exists, setup is already complete.
    if (r.status === 404 || r.status === 409) throw new Error(t('err_already_done'));
    if (r.status === 400) throw new Error(t('err_no_admin'));
    throw new Error(await detailServeur(r));
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = form.email.value.trim();
    if (!email || !form.email.checkValidity()) return showMsg(t('err_email'), false);
    if (!form.displayname.value.trim()) return showMsg(t('err_displayname'), false);
    if (form.password.value.length < 12) return showMsg(t('err_password'), false);
    if (form.password.value !== form.password2.value) return showMsg(t('err_mismatch'), false);
    if (form.password.value.toLowerCase() === email.toLowerCase()) {
        return showMsg(t('err_password_is_email'), false);
    }

    btn.disabled = true;
    btn.textContent = t('submitting');
    try {
        const r = await fetch('/auth/setup/create-admin', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            // Neither username (the address stands for it) nor groups: the
            // server enforces the administrator group.
            body: JSON.stringify({
                displayname: form.displayname.value.trim(),
                email: email,
                password: form.password.value,
            }),
        });
        if (r.status === 404) throw new Error(t('err_already_done'));
        if (r.status === 422) throw new Error(await messageValidation(r));
        // 409: an administrator was ALREADY created, during a previous attempt
        // interrupted before finalisation (network cut, tab closed). Creating
        // again can only fail, so we resume at finalisation. Without this, the
        // installation stayed stuck forever.
        if (!r.ok && r.status !== 409) throw new Error(await detailServeur(r));
        await finaliser();
    } catch (err) {
        showMsg(err instanceof TypeError ? t('err_network') : err.message, false);
        btn.disabled = false;
        btn.textContent = t('submit');
    }
});
</script>
</body>
</html>
