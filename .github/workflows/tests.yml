name: Tests

# Chaque poussee et chaque proposition de fusion. Sans cela, les tests ne
# tournent que si quelqu'un pense a les lancer -- et c'est precisement ce qui a
# laisse sept tests casses passer inapercus pendant des jours.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unitaires:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image auth-service
        run: docker build -t auth-service-test services/auth-service

      # Les dependances de test ne sont pas dans l'image de production : elles
      # sont figees dans requirements-dev.txt pour que la CI et le poste de
      # developpement executent exactement la meme chose.
      #
      # On monte le depot entier, pas seulement sources/ : certains tests
      # relisent des fichiers livres a la racine (orthanc.json.example) pour
      # verifier qu'une ecriture ne les abime pas. Avec un montage reduit ils
      # s'esquivaient en silence -- une couverture qu'on croit avoir et qui
      # n'existe pas.
      - name: Lancer la suite
        run: |
          docker run --rm --entrypoint sh \
            -e AUTH_USERNAME=ci -e AUTH_PASSWORD=mot-de-passe-ci-1234 \
            -e ORTHANC_ADMIN_USER=ci -e ORTHANC_ADMIN_PASS=ci \
            -v "$PWD:/depot" -w /depot/services/auth-service/sources \
            auth-service-test \
            -c 'pip install -q -r requirements-dev.txt && python -m pytest tests/ -q'

  images:
    name: Construction des images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nginx et auth-service seulement : le build d'OHIF compile la
      # visionneuse depuis ses sources et prend une quinzaine de minutes, ce
      # qui n'a pas sa place a chaque poussee. Il reste couvert par le job
      # bout-en-bout, qui tire l'image publiee et l'exerce reellement.
      - name: nginx
        run: docker build -t nginx-test services/nginx

      - name: auth-service
        run: docker build -t auth-service-test services/auth-service

  coherence:
    name: Coherence du depot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scripts executables
        # Un script versionne en 100644 fait echouer le ./bootstrap.sh
        # documente, sans que cela se voie sur le poste ou le bit existe
        # localement.
        run: |
          manquants=$(git ls-files -s '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$manquants" ]; then
            echo "Scripts non executables dans le depot :"
            echo "$manquants"
            exit 1
          fi
          echo "Tous les scripts sont executables."

      - name: Syntaxe des scripts
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || exit 1
          done
          echo "Syntaxe correcte."

      - name: Traductions synchronisees
        # Une cle presente dans une langue et absente de l'autre passe
        # inapercue jusqu'a ce qu'un utilisateur tombe sur un libelle brut.
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          d = Path('services/auth-service/sources/translations')
          fr = json.loads((d / 'fr.json').read_text(encoding='utf-8'))
          en = json.loads((d / 'en.json').read_text(encoding='utf-8'))
          code = 0
          for section in ('ui', 'js'):
              ecart = set(fr.get(section, {})) ^ set(en.get(section, {}))
              if ecart:
                  print(f"section {section} desynchronisee : {sorted(ecart)}")
                  code = 1
          if not code:
              print(f"fr et en couvrent les memes cles ({len(fr['ui'])} en ui).")
          sys.exit(code)
          PY

      - name: Liens du README
        # Le dossier docs/ avait perdu neuf guides sans que les huit liens du
        # README cessent de pointer vers eux.
        run: |
          manquants=""
          for f in $(grep -oE '\(docs/[A-Za-z_.-]+\)' README.md | tr -d '()' | sort -u); do
            [ -f "$f" ] || manquants="$manquants $f"
          done
          if [ -n "$manquants" ]; then
            echo "Liens morts dans le README :$manquants"
            exit 1
          fi
          echo "Tous les liens du README resolvent."

      - name: Compose valide
        run: |
          cp docker-compose.yml.example docker-compose.yml
          docker compose config >/dev/null
          echo "docker-compose.yml.example est valide."

      - name: Services construits localement jamais tires
        # nginx et auth-service portent leur code dans leur image. Sans
        # `pull_policy: build`, docker compose telecharge un tag publie plus
        # tot des lors qu'il existe dans le registre, et l'installation tourne
        # sur un code qui n'est pas celui du clone. C'est exactement ce qui
        # s'est produit : /console en 404 et nginx en boucle de redemarrage,
        # sur une branche dont la CI etait pourtant verte.
        # On relit la configuration telle que docker compose la resout, et non
        # le fichier brut : c'est le parseur reel qui tranche, et cela evite
        # une dependance YAML sur le runner.
        run: |
          docker compose config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json, sys
          services = json.load(open('/tmp/compose.json'))['services']
          # OHIF est l'exception assumee : un quart d'heure de compilation.
          # Sa contrepartie est de publier un tag a chaque changement.
          dispense = {'ohif'}
          fautifs = [
              nom for nom, s in services.items()
              if 'build' in s and nom not in dispense
              and s.get('pull_policy') != 'build'
          ]
          if fautifs:
              print("Services avec build: mais sans pull_policy: build ->", ", ".join(fautifs))
              print("Ils tourneraient sur l'image du registre au lieu du depot.")
              sys.exit(1)
          print("Les services construits localement le sont toujours.")
          PY

  bout-en-bout:
    name: Installation de bout en bout
    # Sur les propositions de fusion et sur master. Ce job monte la pile
    # entiere : trop long pour chaque poussee sur une branche de travail, mais
    # indispensable avant que du code n'arrive sur master. Les trois autres
    # jobs construisent et testent sans jamais faire `docker compose up` --
    # c'est par cet angle mort que sont passees les deux pannes d'installation
    # corrigees dans cette meme proposition.
    #
    # Pour l'etendre a toutes les poussees, retirer la ligne `if:` ci-dessous.
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Le script interroge https://pacs.localhost:31443. La resolution des
      # sous-domaines de .localhost depend du resolveur de l'image du runner :
      # on la fige plutot que d'en dependre.
      - name: Resoudre pacs.localhost
        run: echo "127.0.0.1 pacs.localhost" | sudo tee -a /etc/hosts

      - name: Rejouer une installation complete
        run: ./scripts/e2e-test.sh

      # Le script nettoie derriere lui, y compris apres un echec : sans cette
      # etape il ne resterait que la ligne rouge, sans le detail qui permet de
      # comprendre.
      - name: Journaux en cas d'echec
        if: failure()
        run: |
          for f in /tmp/e2e-bootstrap.log /tmp/e2e-up.log; do
            [ -f "$f" ] && { echo "=== $f ==="; tail -60 "$f"; }
          done
          exit 0
