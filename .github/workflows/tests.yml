name: Tests

# On every push and every pull request. Without this the tests only run when
# somebody remembers to launch them, which is another way of saying they run
# when it is already too late.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the auth-service image
        run: docker build -t auth-service-test services/auth-service/sources

      # Test dependencies are not in the production image: they are pinned in
      # requirements-dev.txt so CI and a developer machine run exactly the
      # same thing.
      #
      # The whole repository is mounted, not just sources/: some tests reread
      # files shipped at the root to check that a write does not damage them.
      # With a reduced mount they would skip themselves silently -- coverage
      # you believe you have and do not.
      - name: Run the suite
        run: |
          docker run --rm --entrypoint sh \
            -e AUTH_USERNAME=ci -e AUTH_PASSWORD=ci-password-1234 \
            -e ORTHANC_ADMIN_USER=ci -e ORTHANC_ADMIN_PASS=ci \
            -v "$PWD:/repo" -w /repo/services/auth-service/sources \
            auth-service-test \
            -c 'pip install -q -r requirements-dev.txt && python -m pytest tests/ -q'

  cloudflare:
    name: Cloudflare helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/cloudflare-tunnel.py creates the tunnel, its routing and the
      # DNS record from an API token. Tested against a stub of the API: no
      # network, no account, and the settings the stack depends on are
      # asserted (no TLS verify, Host header, HTTP/2, the CNAME).
      - name: Against a stub of the Cloudflare API
        run: python3 -m unittest discover -s tests/cloudflare -v

  images:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nginx and auth-service only: the OHIF build compiles the viewer from
      # source and takes about fifteen minutes, which has no place on every
      # push.
      - name: nginx
        run: docker build -t nginx-test services/nginx

      - name: auth-service
        run: docker build -t auth-service-test services/auth-service/sources

  e2e:
    name: Fresh install, end to end (${{ matrix.url }}, ${{ matrix.ssl }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The default address, and a custom one with its own port: an address
    # like https://test.localhost:30003 was accepted by bootstrap.sh while the
    # stack kept listening on 30443.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The defaults bootstrap.sh proposes.
          - url: https://pacs.localhost:30443
            ssl: selfsigned
          # Custom port and your own certificate (SSL_MODE=custom).
          - url: https://test.localhost:30003
            ssl: custom
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Pulls the OHIF image from ghcr.io even while its package is private.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The compose file pins published images. Building this commit's
      # auth-service and nginx under those same tags makes the stack run the
      # code being tested, not the last release. OHIF is pulled: its build
      # takes about fifteen minutes.
      - name: Build the images of this commit
        run: |
          pinned() { grep -oE "ghcr\.io/yokoinc/orthanc-$1:[^[:space:]]+" docker-compose.yml.example | head -1; }
          docker build -q -t "$(pinned auth-service)" services/auth-service/sources
          docker build -q -t "$(pinned nginx)" services/nginx

      - name: Bootstrap, start, browser run, backup, apply
        run: bash tests/e2e/run.sh
        env:
          E2E_URL: ${{ matrix.url }}
          E2E_SSL: ${{ matrix.ssl }}

      - name: Container logs
        if: failure()
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep '^orthanc-'); do
            echo "::group::$c"
            docker logs --tail 80 "$c" 2>&1
            echo "::endgroup::"
          done

  consistency:
    name: Repository consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Admin page coherence
        # The page is rendered by the server and driven by hand-written JS: a
        # renamed route, a tab without its panel or an onclick pointing at a
        # deleted function all pass pytest and fail only in the browser.
        run: python3 scripts/check-admin-page.py

      - name: Executable scripts
        # A script versioned as 100644 breaks the documented
        # ./manage-authelia-users.sh, without showing on the machine where the
        # bit exists locally. Entrypoints are exempt: their Dockerfile chmods
        # them at build time.
        run: |
          missing=$(git ls-files -s '*.sh' \
            | awk '$1 != "100755" {print $4}' \
            | grep -v 'entrypoint\|compressDist' || true)
          if [ -n "$missing" ]; then
            echo "Scripts meant to be run directly, but not executable:"
            echo "$missing"
            exit 1
          fi
          echo "Every directly-invoked script is executable."

      - name: Script syntax
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || exit 1
          done
          echo "Syntax correct."

      - name: Translations in sync
        # A key present in one language and missing from another goes
        # unnoticed until a user hits a raw label. Every translations/*.json is
        # compared with en.json, every section: a language added as a new file
        # is checked without editing this workflow. tests/test_i18n.py goes
        # further (keys used by the code, {variables}).
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          d = Path('services/auth-service/sources/translations')
          ref = json.loads((d / 'en.json').read_text(encoding='utf-8'))
          code = 0
          for f in sorted(d.glob('*.json')):
              data = json.loads(f.read_text(encoding='utf-8'))
              for section in set(ref) | set(data):
                  drift = set(ref.get(section, {})) ^ set(data.get(section, {}))
                  if drift:
                      print(f"{f.name}, section {section}, out of sync with en.json: {sorted(drift)}")
                      code = 1
          if not code:
              print("Every language covers the same keys as en.json.")
          sys.exit(code)
          PY

      - name: README links
        run: |
          missing=""
          for f in $(grep -oE '\(docs/[A-Za-z_.-]+\)' README.md | tr -d '()' | sort -u); do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "Dead links in the README:$missing"
            exit 1
          fi
          echo "Every README link resolves."

      - name: Compose valid
        # POSTGRES_PASSWORD is required by the compose file (${...:?}): without
        # it, PostgreSQL would initialise its volume without a usable password
        # and Orthanc would loop on an authentication failure. Refusing to go
        # on until ./bootstrap.sh is re-run is intended. CI supplies a dummy
        # value to validate the rest of the file.
        run: |
          cp docker-compose.yml.example docker-compose.yml
          printf 'POSTGRES_PASSWORD=ci\n' > .env
          docker compose config >/dev/null
          echo "docker-compose.yml.example is valid."
